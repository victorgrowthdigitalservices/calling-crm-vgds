<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* ================= Comprehensive Mobile-Friendly Styles ================= */
@media (max-width: 920px) {
  .wrap { padding-inline: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
  .portal-topbar { padding: 12px 16px; margin-bottom: 16px; }
  .portal-brand .logo { height: 38px; }
  .portal-brand-text b { font-size: 14.5px; }
  .portal-brand-text span { font-size: 10.5px; }
  .portal-head h1 { font-size: 26px; }
  .portal-head p { font-size: 14px; }
  .portal-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }

  .topbar { padding-block: 8px; }
  .topbar .logo { height: 32px; }
  .topbar nav.tabs { overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; scrollbar-width: none; gap: 4px; padding-block: 4px; }
  .topbar nav.tabs::-webkit-scrollbar { display: none; }
  .topbar nav.tabs .tab { padding: 8px 14px; font-size: 13px; flex-shrink: 0; min-height: 40px; }

  .desk-top { flex-direction: column; align-items: flex-start; gap: 12px; }
  .desk-top .prog { width: 100%; }
  .desk-top .nav-btns { width: 100%; display: flex; justify-content: space-between; gap: 8px; }
  .desk-top .nav-btns .btn { flex: 1; justify-content: center; min-height: 42px; }

  .desk { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .lead-card { padding: 18px 16px; }
  .lead-card .co { font-size: 20px; }
  .phone-box { flex-direction: column; align-items: flex-start; gap: 10px; padding: 12px 14px; }
  .phone-box .ph { font-size: 20px; }
  .phone-box > div { width: 100%; display: flex; gap: 8px; }
  .phone-box > div .btn { flex: 1; justify-content: center; min-height: 42px; font-size: 13px; }

  .form-col .panel { padding: 18px 16px; }
  .status-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .status-grid .sbtn { min-height: 48px; font-size: 13px; padding: 8px 10px; }

  #save { min-height: 48px; font-size: 15px; }

  .big-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .alloc { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .tbl-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
}

@media (max-width: 580px) {
  .wrap { padding-inline: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); }
  .portal { padding-block: 12px 32px; gap: 20px; }
  .portal-topbar { flex-direction: column; gap: 10px; align-items: flex-start; padding: 12px; }
  .portal-topbar .portal-system-pill { align-self: flex-start; }
  .portal-head h1 { font-size: 22px; }
  .portal-grid { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .pcard { padding: 18px 16px; min-height: auto; }
  .demo-note { padding: 10px 14px; font-size: 12px; gap: 6px 10px; }

  .topbar .right { gap: 6px; }
  .clock { display: none; }
  .topbar .btn.sm { padding: 6px 10px; font-size: 12px; }

  .big-kpis { grid-template-columns: minmax(0, 1fr); }
  .alloc { grid-template-columns: minmax(0, 1fr); }
  
  .status-grid { grid-template-columns: 1fr; }
  .phone-box > div { flex-direction: column; }
  .phone-box > div .btn { width: 100%; min-height: 44px; }

  .pins input { width: 44px; height: 52px; font-size: 22px; }
  .modal { padding: 18px 14px; }
}

</style><title>Victor Growth Calling CRM</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: white canvas, brand navy used only for type, brand green for action; light tints carry state. Single light theme by client request. */
:root{
  color-scheme: light;
  --bg:#FFFFFF;
  --surface:#F7F9FC;
  --surface-2:#EEF3F9;
  --line:#E2E9F2;
  --ink:#10305F;
  --ink-2:#55657E;
  --ink-3:#8593A8;
  --green:#17A34A;
  --green-600:#12873C;
  --green-soft:#E8F7EE;
  --navy-soft:#EAF0FA;
  --cA:#2F66D0; --cA-soft:#E8EFFC;
  --cB:#17A34A; --cB-soft:#E8F7EE;
  --cC:#E3961A; --cC-soft:#FDF3E2;
  --warn:#B3261E; --warn-soft:#FDECEC;
  --font-display:"Outfit", "Segoe UI", system-ui, sans-serif;
  --font-body:"Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r-sm:8px; --r:12px; --r-lg:16px;
  --shadow:0 1px 2px rgba(16,48,95,.05), 0 6px 20px rgba(16,48,95,.06);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.ic{flex:none;display:block}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- Portal Gateway (Refined Topbar & Centered Desks) ---------- */
.portal-topbar{width:100%;max-width:1160px;display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border:1px solid var(--line);border-radius:var(--r-lg);background:#fff;margin-bottom:12px;box-shadow:0 2px 8px rgba(16,48,95,.03)}
.portal-brand{display:flex;align-items:center;gap:14px}
.portal-brand .logo{height:46px;width:auto;object-fit:contain}
.portal-brand-text{display:flex;flex-direction:column;gap:2px}
.portal-brand-text b{font-family:var(--font-display);font-size:16px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.portal-brand-text span{font-size:11.5px;font-weight:600;color:var(--green-600);letter-spacing:.03em}
.portal-system-pill{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);padding:6px 14px;border-radius:999px;font-size:12px;font-weight:600;color:var(--ink-2)}
.portal-system-pill i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(23,163,74,.18)}

.portal{padding-block:16px 44px;display:flex;flex-direction:column;align-items:center;gap:28px;width:100%}
.portal-head{text-align:center;display:grid;gap:8px;max-width:760px}
.portal-head .gateway-badge{display:inline-flex;align-items:center;gap:7px;background:var(--navy-soft);color:var(--ink);font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 14px;border-radius:999px;margin:0 auto 2px}
.portal-head h1{font-size:32px;font-weight:700;color:var(--ink);letter-spacing:-.02em;line-height:1.2;margin:0}
.portal-head p{margin:0;color:var(--ink-2);font-size:15px;line-height:1.5}

.portal-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;width:100%;max-width:1160px}
@media (max-width: 980px){.portal-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width: 560px){.portal-grid{grid-template-columns:1fr}}

.pcard{all:unset;box-sizing:border-box;cursor:pointer;background:var(--bg);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:24px 22px 20px;display:flex;flex-direction:column;gap:14px;transition:border-color .18s, box-shadow .18s, transform .18s;min-height:250px;box-shadow:0 2px 6px rgba(16,48,95,.03)}
.pcard:hover{border-color:var(--green);box-shadow:0 12px 28px rgba(16,48,95,.08);transform:translateY(-3px)}
.pcard:focus-visible{outline:2px solid var(--green);outline-offset:3px}
.pcard .card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pcard .badge-ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center}
.pcard .role-tag{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
.pcard h2{font-size:20px;font-weight:700;color:var(--ink);margin:0}
.pcard p{margin:0;color:var(--ink-2);font-size:13px;line-height:1.45}
.pcard .meta{margin-top:auto;display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--line);padding-top:14px;font-size:12.5px;color:var(--ink-2)}
.pcard .go{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--green-600);font-size:13px}
.pcard.admin{background:linear-gradient(180deg,#F2FAF5,var(--bg) 65%);border-color:#CFEBD9}
.pcard.admin:hover{border-color:var(--green)}

.demo-note{font-size:12.5px;color:var(--ink-2);text-align:center;display:flex;gap:8px 16px;flex-wrap:wrap;justify-content:center;align-items:center;padding:12px 22px;background:var(--surface);border:1px solid var(--line);border-radius:12px;max-width:760px}
.demo-note code{font-family:var(--font-body);font-weight:700;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 8px}

/* ---------- Passcode modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(16,48,95,.14);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--bg);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 60px rgba(16,48,95,.18);width:min(400px,100%);padding:28px 26px 22px;display:grid;gap:18px;text-align:center}
.modal .lock{width:52px;height:52px;border-radius:14px;margin:0 auto;display:grid;place-items:center;background:var(--green-soft);color:var(--green-600)}
.modal h3{font-size:21px;font-weight:600}
.pins{display:flex;gap:12px;justify-content:center}
.pins input{width:54px;height:62px;text-align:center;font-size:26px;font-family:var(--font-display);font-weight:600;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);transition:border-color .15s, background .15s}
.pins input:focus{outline:none;border-color:var(--green);background:var(--bg)}
.pins.err input{border-color:var(--warn);background:var(--warn-soft)}
.pins.err{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.err-msg{color:var(--warn);font-size:13px;min-height:20px}
.modal .row{display:flex;gap:10px}
.modal .row .btn{flex:1;justify-content:center}

/* ---------- Buttons / inputs ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:8px 14px;font-weight:500;font-size:13.5px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-600)}
.btn.soft{background:var(--green-soft);border-color:#CDEBD8;color:var(--green-600)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.input,.select,textarea.input{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px 12px;font-size:13.5px;min-width:0}
.input:focus,.select:focus{outline:none;border-color:var(--green)}
.select{padding-right:28px}

/* ---------- App shell ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.topbar .logo{height:40px;width:auto}
.role-pill{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border-radius:999px;font-weight:600;font-size:13px}
.role-pill .av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-family:var(--font-display)}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.live-dot{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--green-600)}
.live-dot i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(23,163,74,.5);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(23,163,74,0)}100%{box-shadow:0 0 0 0 rgba(23,163,74,0)}}
.clock{font-size:13px;color:var(--ink-2)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:12px 14px 11px;color:var(--ink-2);font-weight:500;border-bottom:2.5px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-color:var(--green);font-weight:600}
.tab:focus-visible{outline:2px solid var(--green);outline-offset:-2px;border-radius:6px}
.tab .count{background:var(--surface-2);color:var(--ink-2);border-radius:999px;padding:0 7px;font-size:11.5px;font-weight:600}
.tab .count.hot{background:var(--warn-soft);color:var(--warn)}
main.wrap{padding-block:24px 56px;display:grid;gap:22px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-head h1{font-size:24px;font-weight:600}
.page-head p{margin:2px 0 0;color:var(--ink-2)}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}

.panel{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.panel-h h3{font-size:16px;font-weight:600}
.grid-2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.kpi{background:var(--surface);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px;min-width:0}
.kpi .lbl{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.kpi .lbl i{width:8px;height:8px;border-radius:2px;display:inline-block}
.kpi .val{font-family:var(--font-display);font-size:28px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:11.5px;color:var(--ink-3)}

/* Status pills */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-NC{background:#EEF2F7;color:#5A6B85}
.s-NR{background:#FFF3DA;color:#946000}
.s-NRCH{background:#FDEBE2;color:#AE4718}
.s-INT{background:#E3F6E9;color:#127534}
.s-CB{background:#E5EFFD;color:#1E57B0}
.s-NI{background:#FCE9EA;color:#B3261E}
.s-FU{background:#EFE9FD;color:#6739C2}
.s-CONV{background:var(--green);color:#fff}
.s-CONV::before{background:#fff}
.s-SKIPPED{background:#F1F5F9;color:#475569}
.s-SKIPPED::before{background:#64748B}

/* Caller cards */
.ccard{border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;display:grid;gap:14px;background:var(--bg);min-width:0}
.ccard-top{display:flex;align-items:center;gap:12px}
.avatar{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:17px;flex:none}
.ccard h4{font-size:16px;font-weight:600}
.state{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.state i{width:7px;height:7px;border-radius:50%}
.st-call{color:var(--green-600)} .st-call i{background:var(--green);animation:pulse 1.8s infinite}
.st-active{color:#1E57B0} .st-active i{background:#2F66D0}
.st-idle{color:var(--ink-3)} .st-idle i{background:#B6C1D1}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.mini-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mini-stats div{display:grid}
.mini-stats b{font-family:var(--font-display);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.mini-stats span{font-size:11px;color:var(--ink-3)}
.last-act{font-size:12.5px;color:var(--ink-2);background:var(--surface);border-radius:8px;padding:8px 10px}

/* Summary */
.sum{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:18px}
.big-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.bk{border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;display:flex;gap:14px;align-items:center;background:var(--bg);min-width:0}
.bk .ib{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;flex:none}
.bk .v{font-family:var(--font-display);font-size:32px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.bk .l{font-weight:600;font-size:13.5px;margin-top:4px}
.bk .s{font-size:12px;color:var(--ink-3)}
.orows{display:grid;gap:10px}
.orow{display:grid;grid-template-columns:minmax(0,1fr) auto 44px;gap:4px 10px;align-items:center;font-size:13px}
.orow .nm{display:flex;align-items:center;gap:8px}
.orow .nm i{width:9px;height:9px;border-radius:3px;flex:none}
.orow b{font-variant-numeric:tabular-nums}
.orow .pc{color:var(--ink-3);text-align:right;font-size:12px;font-variant-numeric:tabular-nums}
.orow .track{grid-column:1/-1;height:6px;background:var(--surface-2);border-radius:9px;overflow:hidden}
.orow .track span{display:block;height:100%;border-radius:9px}

/* Caller phones */
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sec-h h2{font-size:19px;font-weight:600}
.phones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;padding:30px 20px 24px;background:linear-gradient(180deg,var(--surface),var(--bg));border:1px solid var(--line);border-radius:24px}
.phone-wrap{display:grid;justify-items:center;gap:12px;min-width:0}
.phone{width:100%;max-width:292px;border-radius:46px;background:#FFFFFF;padding:9px;border:1px solid #D6E0EC;box-shadow:0 26px 50px -14px rgba(16,48,95,.20),inset 0 0 0 5px #F1F5FA}
.screen{border-radius:38px;background:#FBFCFE;border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
.sbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 20px 4px;font-size:11.5px;font-weight:600}
.island{width:76px;height:22px;border-radius:99px;background:#E4EAF2}
.sbar .r{justify-self:end;display:flex;gap:5px;align-items:center;color:var(--ink-2);font-size:10.5px}
.sig{display:inline-flex;gap:1.5px;align-items:flex-end}
.sig i{width:3px;border-radius:1px;background:var(--ink-2)}
.p-head{display:flex;align-items:center;gap:10px;padding:12px 16px}
.p-head .avatar{width:38px;height:38px;font-size:16px}
.p-head b{font-family:var(--font-display);font-size:16px;font-weight:600;display:block;line-height:1.2}
.p-body{padding:0 12px 10px;display:grid;gap:9px}
.ring-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;align-items:center;gap:12px}
.ring-card .t{display:grid;gap:2px;font-size:12px;color:var(--ink-2);min-width:0}
.ring-card .t b{color:var(--ink);font-size:14px}
.p-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pt{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 4px 7px;text-align:center;display:grid;gap:1px;min-width:0}
.pt b{font-family:var(--font-display);font-size:20px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.pt span{font-size:10.5px;color:var(--ink-2);line-height:1.2}
.p-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:4px}
.p-cap{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);display:flex;justify-content:space-between;gap:6px}
.p-row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.p-row:first-of-type{border-top:0}
.p-row .who{min-width:0;display:grid}
.p-row .who b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:12.5px}
.p-row .who span{font-size:11px;color:var(--ink-3)}
.p-row .pill,.p-card .pill{font-size:10.5px;padding:1px 8px}
.p-btn{all:unset;cursor:pointer;text-align:center;font-weight:600;font-size:12.5px;color:var(--green-600);background:var(--green-soft);border-radius:12px;padding:9px}
.p-btn:focus-visible{outline:2px solid var(--green)}
.home-ind{width:108px;height:5px;border-radius:9px;background:#D3DCE8;margin:2px auto 10px}
.phone-label{font-size:13px;color:var(--ink-2)}

/* Feed */
.feed{display:grid;max-height:440px;overflow:auto}
.feed-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.feed-row:last-child{border-bottom:0}
.feed-row .avatar{width:30px;height:30px;font-size:13px;border-radius:9px}
.feed-row .what{font-size:13px;min-width:0}
.feed-row .what b{font-weight:600}
.feed-row .when{font-size:12px;color:var(--ink-3);white-space:nowrap}
.feed-row.new{animation:flash 2.4s}
@keyframes flash{0%{background:var(--green-soft)}100%{background:transparent}}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:600;text-align:left;background:var(--surface);padding:10px 12px;white-space:nowrap;position:sticky;top:0;z-index:1}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle;white-space:nowrap}
td.wrap-txt{white-space:normal;min-width:180px}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface)}
tr.sel td{background:#F2FAF5}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl-scroll{max-height:520px;overflow:auto}
.lead-cell b{display:block;font-weight:600}
.lead-cell span{font-size:12px;color:var(--ink-2)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1 1 200px}
.bulk{display:flex;gap:8px;align-items:center;background:var(--green-soft);border:1px solid #CDEBD8;border-radius:10px;padding:6px 8px 6px 12px;font-size:13px;font-weight:500;color:var(--green-600)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{all:unset;cursor:pointer;padding:6px 14px;border-radius:8px;font-weight:500;font-size:13px;color:var(--ink-2)}
.seg button.on{background:var(--bg);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(16,48,95,.12)}
.seg button:focus-visible{outline:2px solid var(--green)}
.chip{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;font-weight:500;color:var(--ink-2);background:var(--bg)}
.chip.on{border-color:var(--ink);color:var(--ink);background:var(--navy-soft)}
.chip b{font-variant-numeric:tabular-nums}

/* Import */
.drop{border:1.5px dashed #C5D3E6;border-radius:var(--r-lg);background:var(--surface);padding:22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.drop.over{border-color:var(--green);background:var(--green-soft)}
.drop .ic-box{width:52px;height:52px;border-radius:14px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;color:var(--green-600)}
.drop .txt{flex:1 1 240px;min-width:0}
.drop .txt b{font-size:15px;font-family:var(--font-display);font-weight:600}
.cols-hint{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.cols-hint span{font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--ink-2)}
.import-res{margin-top:14px;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:12px}
.res-stats{display:flex;gap:10px;flex-wrap:wrap}
.res-stats div{background:var(--surface);border-radius:10px;padding:8px 14px}
.res-stats b{font-family:var(--font-display);font-size:20px;display:block}
.dupe{display:flex;gap:10px;align-items:center;font-size:12.5px;padding:7px 10px;background:var(--warn-soft);border-radius:8px;color:#7d1d17;flex-wrap:wrap}
.alloc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.alloc div{border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:10px}
.alloc b{font-family:var(--font-display);font-size:20px;font-variant-numeric:tabular-nums}

/* Reports */
.rank{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.rank-card{border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;display:flex;gap:12px;align-items:center;min-width:0}
.rank-card .pos{font-family:var(--font-display);font-size:30px;font-weight:700;color:var(--ink-3);width:38px}
.rank-card.first{border-color:#BFE6CC;background:linear-gradient(135deg,var(--green-soft),var(--bg))}
.rank-card.first .pos{color:var(--green-600)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px}
.chart-box{overflow-x:auto}
.chart-box svg{display:block;min-width:560px;width:100%;height:auto}
.top-row td{background:#F4FBF6}

/* History */
.hist{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:18px;align-items:start}
.lead-list{display:grid;max-height:620px;overflow:auto;border:1px solid var(--line);border-radius:var(--r)}
.li{all:unset;cursor:pointer;display:grid;gap:4px;padding:11px 14px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li:hover{background:var(--surface)}
.li.on{background:var(--navy-soft);box-shadow:inset 3px 0 0 var(--ink)}
.li:focus-visible{outline:2px solid var(--green);outline-offset:-2px}
.li .t{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.li .s{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-2);align-items:center}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px;margin-bottom:16px}
.detail-grid div{display:grid;gap:2px}
.detail-grid span{font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.timeline{position:relative;display:grid;gap:0;padding-left:22px}
.timeline::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl{position:relative;padding:0 0 18px}
.tl::before{content:"";position:absolute;left:-21px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2.5px solid var(--ink-3)}
.tl.c-INT::before{border-color:var(--green)}
.tl.c-NI::before{border-color:#D9534F}
.tl.c-CB::before{border-color:#2F66D0}
.tl.c-FU::before{border-color:#7B4FD6}
.tl.c-NR::before,.tl.c-NRCH::before{border-color:#E3961A}
.tl.c-NOTE::before{border-color:var(--ink)}
.tl .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.tl .rm{margin-top:6px;background:var(--surface);border-radius:8px;padding:8px 12px;font-size:13px}
.tl .fu{margin-top:6px;font-size:12px;color:#1E57B0;display:flex;gap:6px;align-items:center}

/* Caller desk */
.desk-top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.desk-top .prog{flex:1 1 260px;display:grid;gap:6px}
.desk{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.lead-card{border:1px solid var(--line);border-radius:20px;padding:24px;display:grid;gap:18px;background:var(--bg)}
.lead-card .co{font-size:26px;font-weight:600;font-family:var(--font-display);line-height:1.2}
.contact{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.phone-box{display:flex;align-items:center;gap:10px;background:var(--navy-soft);border-radius:14px;padding:12px 14px 12px 16px;flex-wrap:wrap}
.phone-box .ph{font-family:var(--font-display);font-size:26px;font-weight:600;letter-spacing:.02em;user-select:all;font-variant-numeric:tabular-nums}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.fact{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.fact span{font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.fact a{color:#1E57B0;text-decoration:none;font-weight:500;overflow-wrap:anywhere}
.fact a:hover{text-decoration:underline}
.hook{background:var(--green-soft);border-radius:14px;padding:14px 16px;border:1px solid #D3EEDD}
.hook .eyebrow{color:var(--green-600)}
.hook p{margin:6px 0 0;font-size:15px;line-height:1.6}
.biz{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.biz li{display:flex;gap:10px;font-size:13.5px}
.biz li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink-3);margin-top:7px;flex:none}
.status-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sbtn{all:unset;cursor:pointer;box-sizing:border-box;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;font-weight:500;font-size:13px;background:var(--bg);transition:border-color .12s, background .12s}
.sbtn:hover{border-color:#C3D0E2}
.sbtn:focus-visible{outline:2px solid var(--green);outline-offset:1px}
.sbtn i{width:10px;height:10px;border-radius:50%;flex:none}
.sbtn.on{border-color:currentColor}
.sbtn.full{grid-column:1/-1}
.form-col{display:grid;gap:14px}
.field{display:grid;gap:6px}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
textarea.input{min-height:84px;resize:vertical}
.cb-box{border:1px solid #CFE0F7;background:#F3F8FE;border-radius:12px;padding:12px;display:grid;gap:8px}
.cb-box .quick{display:flex;gap:6px;flex-wrap:wrap}
.check{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:500}
.check input{width:16px;height:16px;accent-color:var(--green)}
.nav-btns{display:flex;gap:8px}
.fu-sec{display:grid;gap:10px}
.fu-row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto auto;gap:14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.fu-row .when{font-size:13px;font-weight:600}
.fu-row.over{border-color:#F3C7C4;background:#FFF8F8}
.fu-row.over .when{color:var(--warn)}
.sec-title{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:600;font-size:15px}
.empty{padding:28px;text-align:center;color:var(--ink-3);border:1px dashed var(--line);border-radius:12px}
.stack-bar{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--surface-2)}
.stack-legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px 16px;margin-top:12px;font-size:12.5px}
.stack-legend div{display:flex;justify-content:space-between;gap:8px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--bg);border:1px solid var(--line);box-shadow:0 10px 30px rgba(16,48,95,.16);border-radius:12px;padding:11px 16px;font-weight:500;display:flex;align-items:center;gap:10px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast i{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.foot{font-size:12px;color:var(--ink-3);text-align:center;padding-bottom:24px}

/* ================= Comprehensive Mobile-Friendly Responsiveness ================= */
html, body {
  overflow-x: hidden;
  width: 100%;
  -webkit-text-size-adjust: 100%;
}
@media (max-width: 920px) {
  .wrap {
    padding-inline: max(12px, env(safe-area-inset-left, 0px)) !important;
    padding-right: max(12px, env(safe-area-inset-right, 0px)) !important;
  }
  .portal-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    gap: 14px !important;
  }
  .grid-2, .desk, .hist, .sum {
    grid-template-columns: minmax(0, 1fr) !important;
  }
  .phones {
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)) !important;
    gap: 20px 14px !important;
  }
  .grid-3, .rank {
    grid-template-columns: minmax(0, 1fr) !important;
  }
  .alloc {
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    gap: 10px !important;
  }
  .fu-row {
    grid-template-columns: minmax(0, 1fr) auto !important;
  }
}

@media (max-width: 768px) {
  /* Touch target sizes & prevent iOS Safari auto-zoom on input focus */
  input, select, textarea {
    font-size: 16px !important;
  }
  
  /* Topbar & Sticky Header on Mobile */
  .topbar {
    padding-block: 8px !important;
    position: sticky !important;
    top: 0 !important;
    z-index: 50 !important;
  }
  .topbar .wrap {
    padding-inline: 12px !important;
    gap: 8px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: space-between !important;
  }
  .topbar .logo {
    height: 30px !important;
    width: auto !important;
  }
  .role-pill {
    font-size: 12px !important;
    padding: 3px 8px !important;
    gap: 6px !important;
  }
  .role-pill .av {
    width: 20px !important;
    height: 20px !important;
    font-size: 11px !important;
  }
  .topbar .right {
    margin-left: auto !important;
    display: flex !important;
    align-items: center !important;
    gap: 6px !important;
  }
  .clock, .live-dot {
    display: none !important;
  }
  #logout {
    padding: 6px 10px !important;
    font-size: 12px !important;
    min-height: 36px !important;
  }

  /* Horizontally Swipeable Navigation Tabs */
  nav.tabs {
    display: flex !important;
    flex-direction: row !important;
    flex-wrap: nowrap !important;
    overflow-x: auto !important;
    -webkit-overflow-scrolling: touch !important;
    scrollbar-width: none !important;
    gap: 6px !important;
    padding: 4px 0 2px !important;
    width: 100% !important;
    touch-action: pan-x !important;
  }
  nav.tabs::-webkit-scrollbar {
    display: none !important;
  }
  nav.tabs .tab {
    flex-shrink: 0 !important;
    min-height: 40px !important;
    padding: 8px 12px !important;
    font-size: 13px !important;
    display: inline-flex !important;
    align-items: center !important;
    gap: 6px !important;
    white-space: nowrap !important;
    border-bottom: 2.5px solid transparent !important;
  }
  nav.tabs .tab.on {
    border-bottom-color: var(--green) !important;
    color: var(--ink) !important;
    font-weight: 700 !important;
  }

  /* Calling Desk Single Column Layout */
  .desk-top {
    display: flex !important;
    flex-direction: column !important;
    align-items: stretch !important;
    gap: 10px !important;
  }
  .desk-top .prog {
    width: 100% !important;
  }
  .desk-top .nav-btns {
    width: 100% !important;
    display: flex !important;
    gap: 8px !important;
  }
  .desk-top .nav-btns .btn {
    flex: 1 !important;
    justify-content: center !important;
    min-height: 44px !important;
    font-size: 13.5px !important;
    font-weight: 600 !important;
  }
  .desk {
    display: flex !important;
    flex-direction: column !important;
    width: 100% !important;
    gap: 16px !important;
  }
  .lead-card {
    padding: 16px 14px !important;
    border-radius: 16px !important;
    width: 100% !important;
    box-sizing: border-box !important;
  }
  .lead-card .co {
    font-size: 20px !important;
  }
  .facts {
    grid-template-columns: 1fr !important;
    gap: 8px !important;
  }

  /* Phone Box & Mobile Action Buttons (Call, Copy, WhatsApp) */
  .phone-box {
    flex-direction: column !important;
    align-items: stretch !important;
    gap: 10px !important;
    padding: 12px 14px !important;
    margin-block: 10px !important;
  }
  .phone-box .ph {
    font-size: 20px !important;
    text-align: center !important;
    margin-inline: auto !important;
  }
  .phone-box > div {
    margin-left: 0 !important;
    width: 100% !important;
    display: flex !important;
    gap: 6px !important;
    flex-wrap: wrap !important;
  }
  .phone-box > div .btn,
  .phone-box > div a.btn {
    flex: 1 1 calc(33.333% - 6px) !important;
    min-width: 85px !important;
    justify-content: center !important;
    min-height: 44px !important;
    font-size: 12.5px !important;
    font-weight: 600 !important;
    padding: 8px 6px !important;
  }

  /* Outcome Selection Grid */
  .status-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    gap: 8px !important;
  }
  .status-grid .sbtn {
    min-height: 48px !important;
    font-size: 12.5px !important;
    padding: 8px 10px !important;
  }
  .status-grid .sbtn.full {
    grid-column: 1 / -1 !important;
  }

  /* Audio player 100% width on mobile */
  audio {
    width: 100% !important;
    max-width: 100% !important;
  }

  /* Save Outcome Button */
  #save {
    min-height: 50px !important;
    font-size: 15px !important;
    font-weight: 700 !important;
    width: 100% !important;
    border-radius: 12px !important;
  }

  /* Tables & Lists Touch Scrolling */
  .tbl-wrap {
    width: 100% !important;
    overflow-x: auto !important;
    -webkit-overflow-scrolling: touch !important;
    border-radius: 12px !important;
  }
  .toolbar {
    flex-direction: column !important;
    align-items: stretch !important;
    gap: 8px !important;
  }
  .toolbar input, .toolbar select {
    width: 100% !important;
    min-height: 42px !important;
  }

  /* KPIs & Summary */
  .kpis {
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    gap: 8px !important;
  }
  .big-kpis {
    grid-template-columns: 1fr !important;
    gap: 8px !important;
  }
  .mini-stats {
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    gap: 6px !important;
  }

  /* Live Monitor Caller Phones */
  .phones {
    grid-template-columns: 1fr !important;
    padding: 16px 10px !important;
    gap: 16px !important;
  }
  .phone-wrap {
    width: 100% !important;
    max-width: 320px !important;
    margin: 0 auto !important;
  }
}

@media (max-width: 580px) {
  /* Portal Gateway Screen */
  .portal {
    padding-block: 12px 28px !important;
    gap: 16px !important;
  }
  .portal-topbar {
    flex-direction: column !important;
    align-items: flex-start !important;
    gap: 10px !important;
    padding: 12px 14px !important;
  }
  .portal-brand {
    gap: 10px !important;
  }
  .portal-brand .logo {
    height: 36px !important;
  }
  .portal-brand-text b {
    font-size: 14px !important;
  }
  .portal-brand-text span {
    font-size: 10px !important;
  }
  .portal-head h1 {
    font-size: 22px !important;
  }
  .portal-head p {
    font-size: 13px !important;
  }
  .portal-grid {
    grid-template-columns: 1fr !important;
    gap: 12px !important;
  }
  .pcard {
    min-height: auto !important;
    padding: 18px 14px !important;
  }

  /* PIN Modal */
  .overlay {
    padding: 12px !important;
  }
  .modal {
    width: 100% !important;
    max-width: 360px !important;
    padding: 18px 14px !important;
    border-radius: 16px !important;
  }
  .pins {
    gap: 8px !important;
    justify-content: center !important;
  }
  .pins input {
    width: 44px !important;
    height: 52px !important;
    font-size: 22px !important;
    border-radius: 10px !important;
  }

  /* Compact Phone Action Buttons */
  .phone-box > div {
    flex-direction: column !important;
  }
  .phone-box > div .btn,
  .phone-box > div a.btn {
    width: 100% !important;
    flex: 1 1 100% !important;
  }
  .status-grid {

function makeLead(caller){
  const f=pick(FIRST), l=pick(LAST), b=pick(BRAND), suf=pick(SUFFIX), city=pick(CITIES), spec=pick(SPEC);
  const company=`${b} ${suf}`;
  const slug=b.toLowerCase().replace(/[^a-z]/g,'');
  const num=String(7+Math.floor(R()*3))+String(Math.floor(R()*1e9)).padStart(9,'0');
  const yrs=2+Math.floor(R()*14), ig=(1+R()*24).toFixed(1), rating=(3.8+R()*1.2).toFixed(1), rev=12+Math.floor(R()*240);
  const siteOk=R()>.3;
  return {
    id:SEQ++, name:`${f} ${l}`, first:f, company, phone:num, city,
    website: siteOk?`https://www.${slug}${suf.split(' ')[0].toLowerCase().replace(/[^a-z]/g,'')}.in`:'',
    hook:`Hi ${f}, I came across ${company}'s work on ${spec} in ${city}. We help interior studios get 15–20 qualified project enquiries every month through Google and Instagram. Can I take 2 minutes to show you how?`,
    details:[`Specialises in ${spec}`,`${yrs} years in business · ${city}`,`Instagram: ${ig}k followers`,`Google rating ${rating}★ (${rev} reviews)`, siteOk?'Website live, no enquiry form on homepage':'No website — only Instagram & JustDial listing'],
    caller, status:'NC', history:[], followUp:null, convertedAt:null, source:'Interior Designers – Delhi NCR & Metro.xlsx'
  };
}

function saveStorage(){

function loadStorage(){

// IndexedDB Storage for Audio Recordings to bypass localStorage 5MB limit
let idbConn = null;
function getIDB(){
  return new Promise(resolve => {
    if(idbConn) return resolve(idbConn);
    try{
      const req = indexedDB.open('vgds_crm_recordings_store', 1);
      req.onupgradeneeded = ev => {
        const d = ev.target.result;
        if(!d.objectStoreNames.contains('recs')) d.createObjectStore('recs', { keyPath: 'id' });
      };
      req.onsuccess = ev => { idbConn = ev.target.result; resolve(idbConn); };
      req.onerror = () => resolve(null);
    }catch(err){ resolve(null); }
  });
}

async function saveRecordingsToStorage(){
  try{
    // Save lightweight version to localStorage (prevent QuotaExceededError)
    const light = RECORDINGS.map(r => {
      if(r.url && r.url.length > 500 && r.url.startsWith('data:')){
        return { ...r, url: r.serverUrl || '' };
      }
      return r;
    });
    localStorage.setItem(REC_STORAGE_KEY, JSON.stringify(light));
    broadcastSync('recordings_saved');
    pushStateToServer();
  }catch(e){}

  // Persist complete recordings with full audio data in IndexedDB
  const db = await getIDB();
  if(db){
    try{
      const tx = db.transaction('recs', 'readwrite');
      const store = tx.objectStore('recs');
      store.clear();
      RECORDINGS.forEach(r => store.put(r));
    }catch(e){}
  }
}

async function loadRecordingsFromStorage(){
  try{
    const raw = localStorage.getItem(REC_STORAGE_KEY);
    if(raw){ RECORDINGS = JSON.parse(raw) || []; }
  }catch(e){ RECORDINGS = []; }

  // Load full audio recordings from IndexedDB
  const db = await getIDB();
  if(db){
    try{
      const tx = db.transaction('recs', 'readonly');
      const store = tx.objectStore('recs');
      const req = store.getAll();
      req.onsuccess = () => {
        if(req.result && req.result.length > 0){
          RECORDINGS = req.result;
          if(S.tab === 'recordings') renderTab();
        }
      };
    }catch(e){}
  }
}

const fmtTime=t=>new Date(t).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'});
const fmtDate=t=>new Date(t).toLocaleDateString('en-IN',{day:'numeric',month:'short'});
const fmtDT=t=>{const d=dayStart(t),td=dayStart(Date.now());const p=d===td?'Today':d===td+DAY?'Tomorrow':d===td-DAY?'Yesterday':fmtDate(t);return `${p}, ${fmtTime(t)}`};
const ago=t=>{const m=Math.round((Date.now()-t)/60e3);if(m<1)return'just now';if(m<60)return`${m} min ago`;const h=Math.floor(m/60);if(h<24)return`${h} hr ago`;return fmtDate(t)};
const leadById=id=>LEADS.find(l=>l.id===id);
window.convertLeadFromAdmin = function(id){

const allEntries=()=>LEADS.flatMap(l=>l.history.map(e=>({...e,lead:l}))).sort((a,b)=>b.t-a.t);
const isDue=l=>l.followUp && (l.status==='CB'||l.status==='FU') && l.followUp<=Date.now();
const pendingFU=l=>l.followUp && (l.status==='CB'||l.status==='FU');

function stats(c,from,to){
  const mine=LEADS.filter(l=>l.caller===c);
  const es=[];LEADS.forEach(l=>l.history.forEach(e=>{if(e.by===c&&e.t>=from&&e.t<to)es.push({...e,id:l.id})}));
  const uniq=new Set(es.map(e=>e.id));
  const intLeads=new Set(es.filter(e=>e.status==='INT').map(e=>e.id));
  const days=Math.max(1,Math.round((Math.min(to,Date.now())-from)/DAY)||1);
  const conv=mine.filter(l=>l.convertedAt&&l.convertedAt>=from&&l.convertedAt<to).length;
  const skippedCount = (typeof SKIPPED_LOGS !== 'undefined' ? SKIPPED_LOGS : []).filter(s => s.caller === c && s.time >= from && s.time < to).length;
  return {
    assigned:mine.length, calls:es.length, unique:uniq.size,
    received:es.filter(e=>RECEIVED.includes(e.status)).length,
    notReceived:es.filter(e=>e.status==='NR'||e.status==='NRCH').length,
    interested:intLeads.size, callbacks:es.filter(e=>e.status==='CB').length,
    pending:mine.filter(pendingFU).length, due:mine.filter(isDue).length,
    notInterested:es.filter(e=>e.status==='NI').length,
    converted:conv,
    remaining:mine.filter(l=>l.status==='NC' && !(typeof SKIPPED_LEADS !== 'undefined' && SKIPPED_LEADS.has(l.id))).length,
    done:mine.filter(l=>l.status!=='NC').length,
    skipped:skippedCount,
    avg:+(es.length/days).toFixed(1), rate:uniq.size?Math.round(intLeads.size/uniq.size*100):0,
  };
}
const todayRange=()=>[dayStart(Date.now()),Date.now()+1];
function lastAct(c){let best=null;LEADS.forEach(l=>l.history.forEach(e=>{if(e.by===c&&(!best||e.t>best.t))best={...e,lead:l}}));return best}
function callerState(c){const a=lastAct(c);if(!a)return['st-idle','Offline'];const m=(Date.now()-a.t)/60e3;return m<4?['st-call','On a call']:m<25?['st-active','Active']:['st-idle','Idle']}

    inp.addEventListener('input',()=>{inp.value=inp.value.replace(/\D/g,'').slice(-1);if(inp.value&&i<3)ins[i+1].focus();if(ins.every(x=>x.value))submit()});
    inp.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!inp.value&&i>0)ins[i-1].focus();if(e.key==='Escape')close()});
    inp.addEventListener('paste',e=>{const d=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,4);if(d.length===4){e.preventDefault();d.split('').forEach((c,k)=>ins[k].value=c);submit()}});
  });
  function submit(){
    const code=ins.map(x=>x.value).join('');
    const ok = Array.isArray(PASS[role]) ? PASS[role].includes(code) : code === PASS[role];
    if(ok){close();login(role)}
    else{const p=ov.querySelector('#pins');p.classList.remove('err');void p.offsetWidth;p.classList.add('err');ov.querySelector('#pin-err').textContent='Wrong passcode. Try again.';ins.forEach(x=>x.value='');ins[0].focus()}
  }
  ov.querySelector('form').addEventListener('submit',e=>{e.preventDefault();submit()});
}
function login(role){
  S.role=role;S.tab=role==='admin'?'dispatch':'shift';
  try{
    localStorage.setItem('vgds_crm_active_role', role);
    localStorage.setItem('vgds_crm_active_tab', S.tab);
  }catch(e){}
  if(role!=='admin'){S.desk={idx:firstQueueIdx(role),status:null,remark:'',fu:'',conv:false};const d=LEADS.filter(l=>l.caller===role&&isDue(l)).length;if(d)setTimeout(()=>toast(`${d} follow-up${d>1?'s are':' is'} due now — see the Follow-ups tab.`),400)}
  render();window.scrollTo(0,0);
}

function tickClock(){const c=document.getElementById('clock');if(c)c.textContent=new Date().toLocaleString('en-IN',{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}
setInterval(tickClock,20e3);
function renderTab(){
  const m=document.getElementById('main');
  const f={dispatch:aDispatch,live:aLive,timers:aTimers,leads:aLeads,recordings:aRecordings,reports:aReports,history:aHistory,shift:cShift,desk:cDesk,mine:cMine,follow:cFollow,perf:cPerf}[S.tab];
  if(f) f(m);
}
const av=(c,s='')=>`<span class="avatar ${s}" style="background:${CALLERS[c].soft};color:${CALLERS[c].color}">${CALLERS[c]?.initial||c}</span>`;

/* ======================= ADMIN: Live ======================= */
const OUT_LABEL={INT:'Interested',CB:'Busy – call back later',FU:'Follow-up required',NI:'Not interested',NR:'Call not received',NRCH:'Number not reachable'};
const bk=(icon,bg,fg,v,l,s)=>`<div class="bk"><span class="ib" style="background:${bg};color:${fg}">${ic(icon,22)}</span><div style="min-width:0"><div class="v">${v}</div><div class="l">${l}</div><div class="s">${s}</div></div></div>`;
function phoneScreen(c){
  const t=todayRange(), s=stats(c,...t), a=lastAct(c), [cls,lbl]=callerState(c), C=CALLERS[c];
  const pct=s.assigned?Math.round(s.done/s.assigned*100):0, R2=34, circ=2*Math.PI*R2;
  const mine=[];LEADS.forEach(l=>l.history.forEach(e=>{if(e.by===c&&e.t>=t[0])mine.push({...e,lead:l})}));
  mine.sort((x,y)=>y.t-x.t);
  const tile=(v,l,col)=>`<div class="pt"><b style="color:${col||'var(--ink)'}">${v}</b><span>${l}</span></div>`;
  return `<div class="phone-wrap"><div class="phone" role="img" aria-label="${C.name} phone screen"><div class="screen">
    <div class="sbar"><span class="num">${new Date().toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit',hour12:false})}</span><span class="island"></span>
      <span class="r"><span class="sig"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:10px"></i></span>5G</span></span></div>
    <div class="p-head">${av(c)}<div style="flex:1;min-width:0"><b>${C.name}</b><span class="state ${cls}"><i></i>${lbl}</span></div></div>
    <div class="p-body">
      <div class="ring-card">
        <svg width="84" height="84" viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="${R2}" fill="none" stroke="#E8EEF6" stroke-width="8"/><circle cx="42" cy="42" r="${R2}" fill="none" stroke="${C.hex}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${circ*pct/100} ${circ}" transform="rotate(-90 42 42)"/><text x="42" y="48" text-anchor="middle" font-size="18" font-weight="600" fill="#10305F" font-family="Outfit, sans-serif">${pct}%</text></svg>
        <div class="t"><span>Data completed</span><b class="num">${s.done} of ${s.assigned} leads</b><span class="num">${s.remaining} left · <b style="color:#64748B">${s.skipped} skipped</b></span></div>
      </div>
      <div class="p-cap" style="padding:2px 2px 0"><span>Today</span><span class="num">${s.rate}% conversion</span></div>
      <div class="p-tiles">
        ${tile(s.calls,'Calls made')}${tile(s.received,'Picked up','#127534')}${tile(s.notReceived,'Not picked','#AE4718')}
        ${tile(s.interested,'Interested','#127534')}${tile(s.pending,'Follow-ups','#1E57B0')}${tile(s.skipped,'Skipped','#64748B')}
      </div>
      <div class="p-card"><div class="p-cap"><span>${cls==='st-call'?'On call now':'Last call'}</span><span>${a?ago(a.t):''}</span></div>
        ${a?`<div class="p-row"><div class="who"><b>${esc(a.lead.company)}</b><span>${esc(a.lead.name)}</span></div>${pill(a.status)}</div>`:'<span class="faint" style="font-size:12px">No calls yet today</span>'}</div>
      <div class="p-card"><div class="p-cap"><span>Earlier today</span><span class="num">${Math.max(0,mine.length-1)} calls</span></div>
        ${mine.slice(1,4).map(e=>`<div class="p-row"><div class="who"><b>${esc(e.lead.company)}</b><span class="num">${fmtTime(e.t)}</span></div>${pill(e.status)}</div>`).join('')||'<span class="faint" style="font-size:12px">Nothing else yet</span>'}</div>
      <button class="p-btn" data-rep="${c}">Open full report</button>
    </div>
    <div class="home-ind"></div>
  </div></div><span class="phone-label">${C.name} · ${s.assigned} leads assigned</span></div>`;
}
/* ======================= ADMIN: Dispatch & Daily Upload ======================= */
function aDispatch(m){
  const un=LEADS.filter(l=>!l.caller).length;
  const r=S.importRes;
  const callerStats = ['A','B','C'].map(c=>({
    c,
    name: CALLERS[c].name,
    total: LEADS.filter(l=>l.caller===c).length,
    uncalled: LEADS.filter(l=>l.caller===c && l.status==='NC' && !(typeof SKIPPED_LEADS !== 'undefined' && SKIPPED_LEADS.has(l.id))).length,
    skipped: (typeof SKIPPED_LOGS !== 'undefined' ? SKIPPED_LOGS : []).filter(s=>s.caller===c).length,
    callsToday: LEADS.filter(l=>l.history.some(e=>e.by===c && e.t>=todayRange()[0])).length
  }));
  
  m.innerHTML=`
  <div class="page-head">
    <div>
      <h1>Daily Sheet Upload & Team Dispatch</h1>
      <p>Import your daily calling Excel sheet (.xlsx or .csv), automatically filter duplicate numbers, and dispatch fresh leads to caller queues.</p>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" style="color:var(--green-600);border-color:#CFEBD9;background:#F2FAF5" id="dsp-reload-sheet">${ic('history',15)} Reload 300 Sheet Leads (100 Jumana · 100 Sameena · 100 Sumaiya)</button>
        <button class="btn" style="color:var(--warn);border-color:#F8D7DA;background:#FFF5F5" id="dsp-wipe-all">${ic('trash',15)} Wipe All Data (0 Leads)</button>
      <button class="btn" style="color:var(--ink-2);border-color:var(--line)" id="dsp-reset-act">${ic('history',16)} Reset Today's Calls (0 Calls)</button>
    </div>
  </div>

  <section class="panel">
    <div class="panel-h">
      <h3>1. Select or Drop Daily Calling File</h3>
      <span class="faint">Supports Microsoft Excel (.xlsx, .xls) and CSV (.csv)</span>
    </div>
    <label class="drop" id="dsp-drop" for="dsp-file-in">
      <div class="ic-box" style="background:var(--green-soft);color:var(--green-600)">${ic('upload',28)}</div>
      <div class="txt">

      const L = makeLead(assignedCaller);
      Object.assign(L, {

        first: (row.name || L.name).split(' ')[0],

}

function assign(l,c){if(l.caller===c)return;l.history.push({t:Date.now(),by:'admin',status:'NOTE',remark:c?`Assigned to ${CALLERS[c].name}${l.caller?` (was ${CALLERS[l.caller].name})`:''}`:'Unassigned by admin'});l.caller=c;saveStorage();}
function checkRows(rows,file){
  const existing=new Map(LEADS.map(l=>[digits(l.phone),l]));const seen=new Set();const fresh=[],dupes=[];
  rows.forEach(r=>{const p=digits(r.phone);if(p.length<10){dupes.push({...r,phone:p.padEnd(10,'0'),why:'Invalid phone number'});return}
    if(existing.has(p)){const e=existing.get(p);dupes.push({...r,phone:p,why:`Already in CRM — ${e.company}${e.caller?` (${CALLERS[e.caller].name})`:''}`})}
    else if(seen.has(p)){dupes.push({...r,phone:p,why:'Repeated inside this sheet'})}
    else{seen.add(p);fresh.push({...r,phone:p})}});
  S.importRes={file,total:rows.length,fresh,dupes};renderTab();
}
function mapRow(o){const g=keys=>{for(const k in o){const kk=k.toLowerCase();if(keys.some(x=>kk.includes(x)))return o[k]}return ''};
  return {name:g(['contact','name','person']),company:g(['company','business','firm','studio']),phone:String(g(['phone','mobile','number','contact no'])),website:g(['website','url','site']),city:g(['city','location']),hook:g(['hook','intro','pitch']),details:g(['detail','note','about'])}}
function readFile(f){
  const rd=new FileReader();
  rd.onload=()=>{try{
    let rows=[];
    if(window.XLSX){const wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''})}
    else{const txt=new TextDecoder().decode(rd.result);const lines=txt.split(/\r?\n/).filter(Boolean);const h=lines[0].split(',');rows=lines.slice(1).map(li=>{const v=li.split(',');const o={};h.forEach((k,i)=>o[k.trim()]=(v[i]||'').trim());return o})}
    checkRows(rows.map(mapRow),f.name);
  }catch(err){toast('Could not read that file. Save it as .xlsx or .csv with a header row and try again.')}};
  rd.readAsArrayBuffer(f);
}

/* ======================= ADMIN: Reports ======================= */
function repRange(){
  const n=Date.now(),s=dayStart(n),r=S.rep.range;
  if(r==='daily')return[s,n+1,'Today'];
  if(r==='weekly')return[s-6*DAY,n+1,'Last 7 days'];
  if(r==='monthly')return[s-29*DAY,n+1,'Last 30 days'];
  const f=S.rep.from?new Date(S.rep.from+'T00:00').getTime():s-6*DAY, t=S.rep.to?new Date(S.rep.to+'T00:00').getTime()+DAY:n+1;
  return[f,t,`${fmtDate(f)} – ${fmtDate(t-1)}`];
}
function chartSVG(from,to,callers){
  let buckets=[];
  if(S.rep.range==='daily'){for(let h=9;h<=19;h++)buckets.push([atHour(from,h,0),atHour(from,h+1,0),h<12?`${h}am`:h===12?'12pm':`${h-12}pm`])}
  else{for(let d=dayStart(from);d<to&&buckets.length<62;d+=DAY)buckets.push([d,d+DAY,new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short'})])}
  const data=buckets.map(([a,b])=>callers.map(c=>{let n=0;LEADS.forEach(l=>l.history.forEach(e=>{if(e.by===c&&e.t>=a&&e.t<b)n++}));return n}));
  const max=Math.max(4,...data.flat()), step=Math.ceil(max/4), top=step*4;
  const W=820,H=250,ml=34,mr=8,mt=12,mb=30,pw=W-ml-mr,ph=H-mt-mb;
  const gw=pw/buckets.length, bw=Math.max(2,Math.min(14,(gw*.78)/callers.length));
  const every=Math.ceil(buckets.length/12);
  let g='';
  for(let i=0;i<=4;i++){const y=mt+ph-(i*step/top)*ph;g+=`<line x1="${ml}" x2="${W-mr}" y1="${y}" y2="${y}" stroke="#E2E9F2" ${i?'stroke-dasharray="3 4"':''}/><text x="${ml-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#8593A8">${i*step}</text>`}
  data.forEach((vals,i)=>{const gx=ml+i*gw+(gw-bw*callers.length)/2;
    vals.forEach((v,j)=>{const h=v/top*ph;g+=`<rect x="${gx+j*bw}" y="${mt+ph-h}" width="${bw-1.5}" height="${h}" rx="2.5" fill="${CALLERS[callers[j]].hex}"><title>${CALLERS[callers[j]].name} · ${buckets[i][2]}: ${v} calls</title></rect>`});
    if(i%every===0)g+=`<text x="${ml+i*gw+gw/2}" y="${H-10}" text-anchor="middle" font-size="11" fill="#8593A8">${buckets[i][2]}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Calls per ${S.rep.range==='daily'?'hour':'day'} by caller">${g}</svg>`;
}

/* ======================= SHIFTS & WORK TIMERS ======================= */
const SHIFT_STORAGE_KEY = 'vgds_crm_shifts_v2';
let SHIFTS = {
  A: { status: 'idle', activeSec: 0, breakSec: 0, currentShiftStart: null, lastResumeTime: null, lastBreakStart: null, history: [] },
  B: { status: 'idle', activeSec: 0, breakSec: 0, currentShiftStart: null, lastResumeTime: null, lastBreakStart: null, history: [] },
  C: { status: 'idle', activeSec: 0, breakSec: 0, currentShiftStart: null, lastResumeTime: null, lastBreakStart: null, history: [] }
};

function loadShiftsFromStorage(){
  try{
    const raw = localStorage.getItem(SHIFT_STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      ['A','B','C'].forEach(k => {
        if(parsed[k]){
          SHIFTS[k] = { ...SHIFTS[k], ...parsed[k] };
          if(!Array.isArray(SHIFTS[k].history)) SHIFTS[k].history = [];
        }
      });
    }
  }catch(e){
    console.error('Error loading shifts', e);
  }
}

function saveShiftsToStorage(){
  try{
    localStorage.setItem(SHIFT_STORAGE_KEY, JSON.stringify(SHIFTS));
    broadcastSync('shifts_saved');
    pushStateToServer();
  }catch(e){}
}
loadShiftsFromStorage();

function pad2(n){ return String(Math.floor(n)).padStart(2, '0'); }

function formatHMS(totalSeconds){
  totalSeconds = Math.max(0, Math.floor(totalSeconds || 0));
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = totalSeconds % 60;
  return `${pad2(h)}:${pad2(m)}:${pad2(s)}`;
}

function formatDurationHuman(totalSeconds){
  totalSeconds = Math.max(0, Math.floor(totalSeconds || 0));
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = totalSeconds % 60;
  if(h > 0) return `${h}h ${m}m ${s}s`;
  if(m > 0) return `${m}m ${s}s`;
  return `${s}s`;
}

function getCallerActiveSeconds(callerKey){
  const sh = SHIFTS[callerKey];
  if(!sh) return 0;
  let sec = sh.activeSec || 0;
  if(sh.status === 'running' && sh.lastResumeTime){
    sec += Math.floor((Date.now() - new Date(sh.lastResumeTime).getTime()) / 1000);
  }
  return Math.max(0, sec);
}

function getCallerBreakSeconds(callerKey){
  const sh = SHIFTS[callerKey];
  if(!sh) return 0;
  let sec = sh.breakSec || 0;
  if(sh.status === 'break' && sh.lastBreakStart){
    sec += Math.floor((Date.now() - new Date(sh.lastBreakStart).getTime()) / 1000);
  }
  return Math.max(0, sec);
}

function getCallerTodayTotalActiveSec(callerKey){
  const todayStr = new Date().toISOString().slice(0, 10);
  const sh = SHIFTS[callerKey];
  if(!sh) return 0;
  let sum = 0;
  (sh.history || []).forEach(h => {
    if(h.date === todayStr) sum += (h.activeDurationSec || 0);
  });
  sum += getCallerActiveSeconds(callerKey);
  return sum;
}

function getCallerTodayTotalBreakSec(callerKey){
  const todayStr = new Date().toISOString().slice(0, 10);
  const sh = SHIFTS[callerKey];
  if(!sh) return 0;
  let sum = 0;
  (sh.history || []).forEach(h => {
    if(h.date === todayStr) sum += (h.breakDurationSec || 0);
  });
  sum += getCallerBreakSeconds(callerKey);
  return sum;
}

function startCallerShift(callerKey){
  const sh = SHIFTS[callerKey];
  if(sh.status === 'running') return;
  const now = new Date().toISOString();
  sh.status = 'running';
  if(!sh.currentShiftStart) sh.currentShiftStart = now;
  sh.lastResumeTime = now;
  saveShiftsToStorage();
  toast(`Calling Shift started for ${CALLERS[callerKey].name}! Work timer is now running.`);
  render();
}

function pauseCallerShiftBreak(callerKey){
  const sh = SHIFTS[callerKey];
  if(sh.status !== 'running') return;
  const now = new Date().toISOString();
  if(sh.lastResumeTime){
    sh.activeSec = (sh.activeSec || 0) + Math.floor((Date.now() - new Date(sh.lastResumeTime).getTime()) / 1000);
  }
  sh.status = 'break';
  sh.lastBreakStart = now;
  saveShiftsToStorage();
  toast(`Break started. Work timer paused. Enjoy your break!`);
  render();
}

function resumeCallerShift(callerKey){
  const sh = SHIFTS[callerKey];
  if(sh.status !== 'break') return;
  const now = new Date().toISOString();
  if(sh.lastBreakStart){
    sh.breakSec = (sh.breakSec || 0) + Math.floor((Date.now() - new Date(sh.lastBreakStart).getTime()) / 1000);
  }
  sh.status = 'running';
  sh.lastResumeTime = now;
  saveShiftsToStorage();
  toast(`Break ended. Welcome back! Work timer resumed.`);
  render();
}

function endCallerShift(callerKey){
  const sh = SHIFTS[callerKey];
  if(sh.status === 'idle') return;
  const now = new Date().toISOString();
  if(sh.status === 'running' && sh.lastResumeTime){
    sh.activeSec = (sh.activeSec || 0) + Math.floor((Date.now() - new Date(sh.lastResumeTime).getTime()) / 1000);
  } else if(sh.status === 'break' && sh.lastBreakStart){
    sh.breakSec = (sh.breakSec || 0) + Math.floor((Date.now() - new Date(sh.lastBreakStart).getTime()) / 1000);
  }

  const startTimeMs = sh.currentShiftStart ? new Date(sh.currentShiftStart).getTime() : todayRange()[0];
  let callsMadeInShift = 0;
  LEADS.forEach(l => {
    (l.history || []).forEach(e => {
      if(e.by === callerKey && e.t >= startTimeMs) callsMadeInShift++;
    });
  });

  const completedSession = {
    id: 'sh_' + Date.now(),
    date: new Date().toISOString().slice(0, 10),
    caller: callerKey,
    callerName: CALLERS[callerKey].name,
    startTime: sh.currentShiftStart || now,
    endTime: now,
    activeDurationSec: sh.activeSec || 0,
    breakDurationSec: sh.breakSec || 0,
    callsCount: callsMadeInShift,
    status: 'Completed'
  };

  if(!sh.history) sh.history = [];
  sh.history.unshift(completedSession);

  const loggedActiveStr = formatDurationHuman(completedSession.activeDurationSec);
  sh.status = 'idle';
  sh.activeSec = 0;
  sh.breakSec = 0;
  sh.currentShiftStart = null;
  sh.lastResumeTime = null;
  sh.lastBreakStart = null;

  saveShiftsToStorage();
  toast(`Shift ended! Total active work time logged: ${loggedActiveStr}. Recorded in Admin Console.`);
  render();
}

/* ======================= Skipped Leads Persistence ======================= */
const SKIPPED_STORAGE_KEY = 'vgds_crm_skipped_leads_v1';
const SKIPPED_LOGS_KEY = 'vgds_crm_skipped_logs_v1';
let SKIPPED_LEADS = new Set();
let SKIPPED_LOGS = [];
try {
  const raw = localStorage.getItem(SKIPPED_STORAGE_KEY);
  if(raw) SKIPPED_LEADS = new Set(JSON.parse(raw));
} catch(e){}
try {
  const rawLogs = localStorage.getItem(SKIPPED_LOGS_KEY);
  if(rawLogs) SKIPPED_LOGS = JSON.parse(rawLogs);
} catch(e){}

function saveSkippedLeads(){
  try {
    localStorage.setItem(SKIPPED_STORAGE_KEY, JSON.stringify([...SKIPPED_LEADS]));
    broadcastSync('skipped_saved');
    pushStateToServer();
  } catch(e){}
}
function saveSkippedLogs(){
  try {
    localStorage.setItem(SKIPPED_LOGS_KEY, JSON.stringify(SKIPPED_LOGS));
    broadcastSync('skipped_saved');
    pushStateToServer();
  } catch(e){}
}

        cDesk(m);
