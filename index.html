  }

  // Active Lead view
  const D = S.desk || { queueIdx: 0, status: null, remark: '', fu: '', conv: false, recording: null };
  S.desk = D;
  const needsFU = D.status === 'CB' || D.status === 'FU';
  const prevCalls = L.history.filter(e => e.status !== 'NOTE');
  const currentLeadPos = isExplicitView ? `Specific Review Lead` : `Lead ${st.done + 1} of ${allMine.length}`;

  m.innerHTML = `
  <div class="desk-top">
    <div>
      <span class="eyebrow">${isExplicitView ? 'Review Lead' : 'Active Calling Queue'}</span>
      <h1 style="font-size:22px">${currentLeadPos} <span class="faint" style="font-weight:500">(${uncalledQueue.length} fresh left)</span></h1>
    </div>
    <div class="prog">
      <div style="display:flex;justify-content:space-between;font-size:12.5px">
        <span class="muted"><b class="num" style="color:var(--ink)">${st.done}</b> called · <b class="num" style="color:var(--ink)">${uncalledQueue.length}</b> left to call · <b class="num" style="color:var(--ink)">${st.calls}</b> calls today</span>
        <span class="num">${pct}%</span>
      </div>
      <div class="bar"><span style="width:${pct}%;background:${CALLERS[S.role].hex}"></span></div>
    </div>
    ${dueN ? `<button class="btn" id="go-due" style="border-color:#F3C7C4;color:var(--warn);background:var(--warn-soft)">${ic('bell',16)} ${dueN} follow-up${dueN>1?'s':''} due</button>` : ''}
    <div class="nav-btns">
      <button class="btn" id="prev" ${(D.queueIdx || 0) === 0 ? 'disabled' : ''}>${ic('left',16)} Previous</button>
      <button class="btn" id="next">Skip ${ic('arrow',16)}</button>
    </div>
  </div>

  ${deskTimerBanner}

  <div class="desk">
    <article class="lead-card">
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap">
        <div style="min-width:0">
          <div class="co">${esc(L.company)}</div>
          <div class="muted" style="font-size:15px;margin-top:2px">${esc(L.name)} · ${esc(L.city)}</div>
          ${L.website ? `
            <div style="margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <a href="${esc(L.website)}" target="_blank" rel="noopener noreferrer" style="display:inline-flex;align-items:center;gap:6px;background:#EFF6FF;color:#1D4ED8;border:1px solid #BFDBFE;padding:4px 12px;border-radius:8px;font-size:13px;font-weight:600;text-decoration:none">
                ${ic('globe',15)} ${esc(L.website.replace(/^https?:\/\//,'').replace(/\/$/,''))} ↗
              </a>
              <span class="faint" style="font-size:12px">Client Website</span>
            </div>
          ` : ''}
        </div>
        ${L.convertedAt ? '<span class="pill s-CONV">Converted</span>' : pill(L.status, false)}
      </div>

      <!-- Phone Number Box with Direct Call, Copy & Website -->
      <div class="phone-box" style="padding:12px 14px;background:var(--navy-soft);border:1.5px solid #CFDEEF;border-radius:var(--r);display:flex;align-items:center;gap:12px;margin-block:12px;flex-wrap:wrap">
        <span style="color:var(--cA);display:grid;place-items:center">${ic('phone',22)}</span>
        <b class="ph num" style="font-size:19px;letter-spacing:.02em;color:var(--ink)">${phoneFmt(L.phone)}</b>
        <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn sm" id="copy-ph" style="font-weight:600">${ic('copy',14)} Copy Number</button>
          <a href="tel:${L.phone}" class="btn sm primary" style="text-decoration:none">${ic('phone',14)} Call</a>
          <a href="https://wa.me/91${digits(L.phone)}" target="_blank" class="btn sm" style="text-decoration:none;background:#E8F7EE;color:#12873C;border-color:#CFEBD9;font-weight:600">WhatsApp</a>
          ${L.website ? `
            <a href="${esc(L.website)}" target="_blank" rel="noopener noreferrer" class="btn sm" style="text-decoration:none;background:#2563EB;color:#fff;border-color:#2563EB;font-weight:600">
              ${ic('globe',14)} Open Website ↗
            </a>
          ` : ''}
        </div>
      </div>

      ${isDue(L) ? `<div class="dupe" style="background:#F3F8FE;color:#1E57B0">${ic('clock',14)} Callback was scheduled for ${fmtDT(L.followUp)} — this lead is due now.</div>` : ''}
      <div class="facts">
        <div class="fact"><span>Contact Person</span><b>${esc(L.name)}</b></div>
        <div class="fact"><span>Location</span><b>${esc(L.city)}</b></div>
        <div class="fact" style="grid-column:span 2">
          <span>Client Website</span>
          ${L.website ? `<a href="${esc(L.website)}" target="_blank" rel="noopener noreferrer" style="color:#1D4ED8;font-weight:700;display:inline-flex;align-items:center;gap:6px;word-break:break-all;font-size:14px">${ic('globe',15)} ${esc(L.website)} ↗</a>` : '<span class="faint">—</span>'}
        </div>
        <div class="fact"><span>Lead ID</span><b class="num">#${L.id} · ${esc(L.source || 'Assigned')}</b></div>
        <div class="fact"><span>Assigned Caller</span><b>${CALLERS[L.caller]?.name || L.caller}</b></div>
      </div>

      ${L.details && L.details.length ? `
      <div class="pitch" style="background:var(--surface);border-left:3px solid var(--ink-2);margin-block:12px">
        <div class="lbl" style="color:var(--ink-2)">Studio Details & Intelligence</div>
        <div style="display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink);margin-top:4px">
          ${L.details.map(d => `<div>• ${esc(d)}</div>`).join('')}
        </div>
      </div>` : ''}

      <div class="pitch">
        <div class="lbl">SEO Outreach Pitch Hook (Website Portfolio Audit)</div>
        <p style="font-size:14px;line-height:1.5">${esc(L.hook)}</p>
        ${L.website ? `
          <div style="margin-top:8px;padding-top:8px;border-top:1px dashed #E2E8F0;font-size:12.5px;display:flex;align-items:center;gap:8px">
            <span class="faint">Target Domain:</span>
            <a href="${esc(L.website)}" target="_blank" rel="noopener noreferrer" style="color:var(--cA);font-weight:700">${esc(L.website)} ↗</a>
          </div>
        ` : ''}
      </div>

      <div class="co-hist">
        <b>Quick Pitch Talking Points:</b>
        <p class="muted" style="margin:4px 0 0;font-size:13.5px;line-height:1.5">
          "Hello, I am calling from Victor Growth Digital Services regarding your studio website. We reviewed your portfolio rankings and noticed major untapped high-intent residential search terms in your area that competitors are currently capturing."
        </p>
      </div>
    </article>

    <div class="flow">
      <section class="panel" style="display:grid;gap:14px">
        <div>
          <h3>Log Call Outcome</h3>
          <p class="muted" style="margin:2px 0 0">Select the result of your call. Submitted leads automatically advance to the next uncalled contact.</p>
        </div>
        <div class="status-grid">
          <button type="button" class="sbtn s-INT ${D.status==='INT'?'on':''}" data-st="INT">${OUT_LABEL.INT}</button>
          <button type="button" class="sbtn s-CB ${D.status==='CB'?'on':''}" data-st="CB">${OUT_LABEL.CB}</button>
          <button type="button" class="sbtn s-FU ${D.status==='FU'?'on':''}" data-st="FU">${OUT_LABEL.FU}</button>
          <button type="button" class="sbtn s-NI ${D.status==='NI'?'on':''}" data-st="NI">${OUT_LABEL.NI}</button>
          <button type="button" class="sbtn s-NR ${D.status==='NR'?'on':''}" data-st="NR">${OUT_LABEL.NR}</button>
          <button type="button" class="sbtn s-NRCH ${D.status==='NRCH'?'on':''}" data-st="NRCH">${OUT_LABEL.NRCH}</button>
        </div>

        ${needsFU ? `
        <div class="fu-box" style="background:#FFF9F2;border:1.5px solid #F8DFC2;border-radius:var(--r);padding:14px;display:grid;gap:10px">
          <div style="font-weight:600;font-size:13px;color:#93460A;display:flex;align-items:center;gap:6px">
            ${ic('clock',16)} Callback Schedule (Moves lead to Follow-ups tab)
          </div>
          <div class="field" style="margin:0">
            <label for="fu-dt" style="font-size:12px;color:#93460A">Callback Date & Time</label>
            <input class="input" type="datetime-local" id="fu-dt" value="${D.fu||''}" style="background:#fff">
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <button type="button" class="btn sm" data-q="t11" style="background:#fff">Tomorrow 11 AM</button>
            <button type="button" class="btn sm" data-q="t17" style="background:#fff">Tomorrow 5 PM</button>
            <button type="button" class="btn sm" data-q="d3" style="background:#fff">In 3 Days</button>
            <button type="button" class="btn sm" data-q="7200000" style="background:#fff">+2 Hours</button>
          </div>
        </div>` : ''}

        ${D.status==='INT' ? `
        <label class="conv-box" style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--green-soft);border:1px solid #CFEBD9;border-radius:var(--r);cursor:pointer">
          <input type="checkbox" id="conv" ${D.conv?'checked':''} style="width:18px;height:18px;accent-color:var(--green)">
          <div>
            <b style="font-size:13.5px;color:var(--green-600)">Mark as Converted Client</b>
            <div class="faint" style="font-size:12px">Client agreed to proposal / scheduled executive meeting.</div>
          </div>
        </label>` : ''}

        <!-- Dedicated Audio Recording Upload Box -->
        <div class="recording-box" style="background:#F8FAFD;border:1.5px dashed #CBDCF0;border-radius:var(--r);padding:14px;display:grid;gap:10px">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span style="font-weight:600;font-size:13px;color:var(--ink);display:inline-flex;align-items:center;gap:6px">
              ${ic('mic',16)} Call Audio Recording (Optional)
            </span>
            <label for="c-rec-file" class="btn sm" style="cursor:pointer;background:#fff;border-color:var(--line)">
              ${ic('upload',14)} Upload Audio
            </label>
            <input type="file" id="c-rec-file" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.weba" hidden>
          </div>

          ${D.recording ? `
          <div style="display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px;flex-wrap:wrap">
            ${ic('audio',16)}
            <div style="flex:1;min-width:140px;overflow:hidden">
              <div style="font-weight:600;font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(D.recording.name)}</div>
              <div class="faint" style="font-size:11px">${D.recording.size ? Math.round(D.recording.size/1024) + ' KB' : 'Audio File'}</div>
            </div>
            <audio controls src="${D.recording.url}" style="height:32px;max-width:240px"></audio>
            <button type="button" class="btn sm" id="c-rec-del" style="color:var(--warn);border-color:#F8D7DA;padding:4px 10px">Remove</button>
          </div>` : `
          <div class="faint" style="font-size:12px;color:var(--ink-2)">
            Upload call audio here. It will immediately show up in Admin Command Center under <b>${CALLERS[S.role].name}</b> for review.
          </div>`}
        </div>

        <div class="field">
          <label for="remark" style="font-size:12.5px;font-weight:600">Discussion Notes & Remarks</label>
          <textarea class="input" id="remark" placeholder="What did the client say? Budget, timing, objections, next step…">${esc(D.remark)}</textarea>
        </div>

        <button class="btn primary" id="save" style="justify-content:center;padding:12px;font-size:14px;font-weight:700" ${D.status?'':'disabled'}>
          ${ic('check',16)} Save Call Outcome & Next Lead ${ic('arrow',16)}
        </button>
      </section>

      <section class="panel">
        <div class="panel-h" style="margin-bottom:10px">
          <h3>Previous calls</h3>
          <span class="faint num">${prevCalls.length}</span>
        </div>
        ${L.history.length ? `<div class="timeline">${[...L.history].reverse().map(timelineItem).join('')}</div>` : '<div class="empty" style="padding:16px">First call to this lead.</div>'}
      </section>
    </div>
  </div>`;

  attachTimerHandlers(m);

  // Navigation:
  m.querySelector('#prev').onclick = () => {
    if((D.queueIdx || 0) > 0){
      D.queueIdx--;
      D.status = null;
      D.recording = null;
      cDesk(m);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  };

  m.querySelector('#next').onclick = () => {
    SKIPPED_LEADS.add(L.id);
    saveSkippedLeads();

    const callerKey = S.role;
    const skipRec = {
      id: 'skip_' + Date.now() + '_' + L.id,
      caller: callerKey,
      callerName: CALLERS[callerKey]?.name || callerKey,
      leadId: L.id,
      company: L.company || '',
      name: L.name || '',
      phone: L.phone || '',
      city: L.city || '',
      time: Date.now()
    };
    SKIPPED_LOGS.unshift(skipRec);
    saveSkippedLogs();

    if(!L.history) L.history = [];
    L.history.push({
      t: Date.now(),
      by: callerKey,
      status: 'SKIPPED',
      remark: 'Skipped lead from active queue'
    });
    saveStorage();

    toast(`Skipped: ${L.company}. Recorded in Admin Audit Log.`);
    S.desk = { queueIdx: 0, viewLeadId: null, status: null, remark: '', fu: '', conv: false, recording: null };
    cDesk(m);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  const gd = m.querySelector('#go-due');
  if(gd) gd.onclick = () => { S.tab = 'follow'; render(); };

  m.querySelector('#copy-ph').onclick = () => {
    const t = '+91' + L.phone;
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject())
      .then(() => toast('Number copied: ' + t))
      .catch(() => {
        const r = document.createRange();
        r.selectNodeContents(m.querySelector('.ph'));
        const s = getSelection();
        s.removeAllRanges();
        s.addRange(r);
        toast('Number selected — press Ctrl+C');
      });
  };

  const rm = m.querySelector('#remark');
  rm.oninput = () => D.remark = rm.value;

  m.querySelectorAll('[data-st]').forEach(b => b.onclick = () => {
    D.status = b.dataset.st;
    if((D.status === 'CB' || D.status === 'FU') && !D.fu){
      D.fu = toLocalInput(atHour(dayStart(Date.now()) + DAY, 11, 0));
    }
    cDesk(m);
  });

  const fd = m.querySelector('#fu-dt');
  if(fd) fd.onchange = () => D.fu = fd.value;

  m.querySelectorAll('[data-q]').forEach(b => b.onclick = () => {
    const v = b.dataset.q, n = Date.now();
    const t = v === 't11' ? atHour(dayStart(n) + DAY, 11, 0) :
              v === 't17' ? atHour(dayStart(n) + DAY, 17, 0) :
              v === 'd3'  ? atHour(dayStart(n) + 3 * DAY, 11, 0) : n + (+v);
    D.fu = toLocalInput(t);
    cDesk(m);
  });

  const cv = m.querySelector('#conv');
  if(cv) cv.onchange = () => D.conv = cv.checked;

  // Recording file handler
  const cRecFile = m.querySelector('#c-rec-file');
  if(cRecFile){
    cRecFile.onchange = () => {
      const file = cRecFile.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        D.recording = {
          name: file.name,
          size: file.size,
          type: file.type,
          url: ev.target.result,
          uploadedAt: Date.now()
        };
        try {
          const fd = new FormData();
          fd.append('recording', file);
          fetch('/api/recordings/upload', { method: 'POST', body: fd })
            .then(res => res.json())
            .then(data => { if(data.url) D.recording.serverUrl = data.url; })
            .catch(()=>{});
        } catch(err){}
        cDesk(m);
      };
      reader.readAsDataURL(file);
    };
  }

  const cRecDel = m.querySelector('#c-rec-del');
  if(cRecDel){
    cRecDel.onclick = () => { D.recording = null; cDesk(m); };
  }

  // Save Outcome
  m.querySelector('#save').onclick = () => {
    if(!D.status) return;
    const e = { t: Date.now(), by: S.role, status: D.status, remark: D.remark.trim() };
    const isFU = D.status === 'CB' || D.status === 'FU';

    if(isFU){
      const t = new Date(D.fu).getTime();
      if(!t){ toast('Pick a callback date and time first.'); return; }
      e.fu = t;
      L.followUp = t;
    } else {
      L.followUp = null;
    }

    if(D.recording){
      e.recording = D.recording;
      RECORDINGS.unshift({
        id: 'rec-' + Date.now(),
        caller: S.role,
        leadId: L.id,
        company: L.company,
        name: L.name,
        phone: L.phone,
        city: L.city,
        status: D.status,
        remark: D.remark.trim(),
        date: Date.now(),
        file: D.recording.name,
        size: D.recording.size,
        url: D.recording.serverUrl || D.recording.url
      });
      saveRecordingsToStorage();
    }

    L.history.push(e);
    L.status = D.status;
    if(D.status === 'INT' && D.conv) L.convertedAt = Date.now();
    saveStorage();
    D.recording = null;

    if(isFU){
      toast(`Callback scheduled for ${fmtDT(L.followUp)}! Lead moved to Follow-ups tab.`);
    } else {
      toast(`Saved: ${L.company} → ${SHORT[D.status]}`);
    }

    // Reset desk state for next uncalled lead
    S.desk = { queueIdx: 0, viewLeadId: null, status: null, remark: '', fu: '', conv: false, recording: null };
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
}
const toLocalInput=t=>{const d=new Date(t);const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`};
function openInDesk(id){S.desk={viewLeadId:id,queueIdx:0,status:null,remark:'',fu:'',conv:false,recording:null};S.tab='desk';render();window.scrollTo(0,0)}

/* ======================= CALLER: My Leads ======================= */
function cMine(m){
  const ls=myLeads();const f=S.myFilter;
  const rows=ls.filter(l=>f==='all'||(f==='CONV'?l.convertedAt:l.status===f));
  m.innerHTML=`
  <div class="page-head"><div><h1>My Leads</h1><p>Only leads assigned to ${CALLERS[S.role].name}. Click a row to open it on the calling desk.</p></div></div>
  <div style="display:flex;gap:6px;flex-wrap:wrap">${[['all','All',ls.length],...Object.keys(ST).map(k=>[k,SHORT[k],ls.filter(l=>l.status===k).length]),['CONV','Converted',ls.filter(l=>l.convertedAt).length]].map(([k,l,n])=>`<button class="chip ${f===k?'on':''}" data-mf="${k}">${l} <b>${n}</b></button>`).join('')}</div>
  <div class="tbl-wrap tbl-scroll"><table>
    <thead><tr><th>#</th><th>Company / Contact</th><th>Phone</th><th>City</th><th>Status</th><th>Calls</th><th>Last remark</th><th>Follow-up</th></tr></thead>
    <tbody>${rows.map(l=>{const last=[...l.history].reverse().find(e=>e.status!=='NOTE');return `<tr class="click" data-open="${l.id}"><td class="faint num">${ls.indexOf(l)+1}</td>
      <td class="lead-cell">
        <b>${esc(l.company)}</b>
        <span>${esc(l.name)}</span>
        ${l.website ? `<a href="${esc(l.website)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" style="color:#1D4ED8;font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;gap:3px;margin-top:2px">${esc(l.website.replace(/^https?:\/\//,'').replace(/\/$/,''))} ↗</a>` : ''}
      </td><td class="num">${phoneFmt(l.phone)}</td><td>${esc(l.city)}</td>
      <td>${l.convertedAt?'<span class="pill s-CONV">Converted</span>':pill(l.status)}</td><td class="num">${l.history.filter(e=>e.status!=='NOTE').length}</td>
      <td class="wrap-txt muted" style="max-width:300px">${last?esc(last.remark):'—'}</td>
      <td class="num" style="${isDue(l)?'color:var(--warn);font-weight:600':''}">${pendingFU(l)?fmtDT(l.followUp):'—'}</td></tr>`}).join('')}</tbody></table></div>`;
  m.querySelectorAll('[data-mf]').forEach(b=>b.onclick=()=>{S.myFilter=b.dataset.mf;cMine(m)});
  m.querySelectorAll('[data-open]').forEach(r=>r.onclick=()=>openInDesk(+r.dataset.open));
}

/* ======================= CALLER: Follow-ups ======================= */
function cFollow(m){
  const ls=myLeads().filter(pendingFU).sort((a,b)=>a.followUp-b.followUp);
  const n=Date.now(),eod=dayStart(n)+DAY;
  const over=ls.filter(l=>l.followUp<=n), today=ls.filter(l=>l.followUp>n&&l.followUp<eod), later=ls.filter(l=>l.followUp>=eod);
  const row=(l,o)=>{const last=[...l.history].reverse().find(e=>e.status!=='NOTE');return `<div class="fu-row ${o?'over':''}">
    <div style="min-width:0"><b>${esc(l.company)}</b><div class="muted" style="font-size:12.5px">${esc(l.name)} · <span class="num">${phoneFmt(l.phone)}</span></div></div>
    <div class="muted" style="font-size:12.5px;min-width:0">${last?esc(last.remark):''}</div>
    <div style="display:grid;justify-items:end;gap:3px"><span class="when num">${fmtDT(l.followUp)}</span>${pill(l.status)}</div>
    <button class="btn ${o?'primary':''} sm" data-open="${l.id}">${ic('phone',14)} Call now</button></div>`};
  const sec=(t,arr,o,color)=>`<section class="fu-sec"><div class="sec-title" style="color:${color}">${t} <span class="count faint num">(${arr.length})</span></div>${arr.length?arr.map(l=>row(l,o)).join(''):'<div class="empty" style="padding:16px">Nothing here.</div>'}</section>`;
  m.innerHTML=`
  <div class="page-head"><div><h1>Follow-ups</h1><p>Callbacks you scheduled. Leads move into "Due now" automatically when their time comes.</p></div></div>
  ${sec('Due now',over,true,'var(--warn)')}
  ${sec('Later today',today,false,'#1E57B0')}
  ${sec('Upcoming',later,false,'var(--ink)')}`;
  m.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openInDesk(+b.dataset.open));
}

/* ======================= CALLER: Performance ======================= */
function cPerf(m){
  const c=S.role,t=stats(c,...todayRange()),w=stats(c,dayStart(Date.now())-6*DAY,Date.now()+1),mo=stats(c,dayStart(Date.now())-29*DAY,Date.now()+1);
  const kp=(l,v,sub)=>`<div class="kpi"><span class="lbl">${l}</span><span class="val">${v}</span>${sub?`<span class="sub">${sub}</span>`:''}</div>`;
  const ls=myLeads();const counts=Object.keys(ST).map(k=>[k,ls.filter(l=>l.status===k).length]);
  const days=[];for(let i=6;i>=0;i--){const d=dayStart(Date.now())-i*DAY;let n=0;ls.forEach(l=>l.history.forEach(e=>{if(e.by===c&&e.t>=d&&e.t<d+DAY)n++}));days.push([d,n])}
  const mx=Math.max(4,...days.map(d=>d[1]));
  m.innerHTML=`
  <div class="page-head"><div><h1>My Performance</h1><p>${CALLERS[c].name} · today and recent trend.</p></div></div>
  <section class="kpis">
    ${kp('Calls today',t.calls,`${t.unique} unique leads`)}${kp('Received',t.received,`${t.notReceived} not received`)}
    ${kp('Interested',t.interested,`${t.rate}% conversion`)}${kp('Pending follow-ups',t.pending,`${t.due} due now`)}
    ${kp('Not interested',t.notInterested,'')}${kp('Left to call',t.remaining,`${t.skipped} skipped · ${t.assigned} assigned`)}
  </section>
  <section class="grid-2">
    <div class="panel"><div class="panel-h"><h3>Calls, last 7 days</h3><span class="faint num">avg ${w.avg}/day</span></div>
      <svg viewBox="0 0 420 170" style="width:100%;height:auto;display:block" role="img" aria-label="Calls per day over the last 7 days">
        ${[0,.5,1].map(f=>`<line x1="0" x2="420" y1="${140-f*120}" y2="${140-f*120}" stroke="#E2E9F2" ${f?'stroke-dasharray="3 4"':''}/>`).join('')}
        ${days.map(([d,n],i)=>{const h=n/mx*120,x=i*60+14;return `<rect x="${x}" y="${140-h}" width="32" height="${h}" rx="5" fill="${i===6?CALLERS[c].hex:'#C9D6EA'}"/><text x="${x+16}" y="${134-h}" text-anchor="middle" font-size="12" font-weight="600" fill="#10305F">${n}</text><text x="${x+16}" y="160" text-anchor="middle" font-size="11" fill="#8593A8">${i===6?'Today':new Date(d).toLocaleDateString('en-IN',{weekday:'short'})}</text>`}).join('')}
      </svg></div>
    <div class="panel"><div class="panel-h"><h3>Where my leads stand</h3><span class="faint num">${ls.length} leads</span></div>
      <div class="stack-bar">${counts.filter(x=>x[1]).map(([k,n])=>`<span title="${ST[k].label}: ${n}" style="width:${n/ls.length*100}%;background:${ST[k].hex}"></span>`).join('')}</div>
      <div class="stack-legend">${counts.map(([k,n])=>`<div><span style="display:inline-flex;gap:7px;align-items:center"><i style="width:9px;height:9px;border-radius:3px;background:${ST[k].hex};display:inline-block"></i>${SHORT[k]}</span><b class="num">${n}</b></div>`).join('')}</div>
    </div>
  </section>
  <section class="panel"><div class="panel-h"><h3>Summary</h3></div>
    <div class="tbl-wrap"><table><thead><tr><th>Period</th><th class="r">Calls</th><th class="r">Unique</th><th class="r">Received</th><th class="r">Interested</th><th class="r">Not interested</th><th class="r">Converted</th><th class="r">Avg/day</th><th class="r">Conv. rate</th></tr></thead>
    <tbody>${[['Today',t],['Last 7 days',w],['Last 30 days',mo]].map(([l,s])=>`<tr><td><b>${l}</b></td>${['calls','unique','received','interested','notInterested','converted','avg'].map(k=>`<td class="r">${s[k]}</td>`).join('')}<td class="r"><b>${s.rate}%</b></td></tr>`).join('')}</tbody></table></div>
  </section>`;
}

(function initSession(){
  try{
    const savedRole = localStorage.getItem('vgds_crm_active_role');
    const savedTab = localStorage.getItem('vgds_crm_active_tab');
    if(savedRole && (savedRole === 'admin' || CALLERS[savedRole])){
      S.role = savedRole;
      S.tab = savedTab || (savedRole === 'admin' ? 'dispatch' : 'desk');
      if(savedRole !== 'admin'){
        S.desk = { idx: firstQueueIdx(savedRole), status: null, remark: '', fu: '', conv: false, recording: null };
      }
    }
  }catch(e){}
})();

/* ======================= Live 1-Second Timer Ticker ======================= */
setInterval(() => {
  if(!S.role) return;
  if(S.role !== 'admin'){
    const sh = SHIFTS[S.role];
    if(sh && sh.status !== 'idle'){
      const activeSec = getCallerActiveSeconds(S.role);
      const breakSec = getCallerBreakSeconds(S.role);
      const elTimer = document.getElementById('shift-live-timer');
      if(elTimer){
        elTimer.textContent = sh.status === 'break' ? formatHMS(breakSec) : formatHMS(activeSec);
      }
      const elDeskTimer = document.getElementById('desk-live-timer-val');
      if(elDeskTimer){
        elDeskTimer.textContent = sh.status === 'break' ? `Break: ${formatHMS(breakSec)}` : `Active: ${formatHMS(activeSec)}`;
      }
      const elTodayWork = document.getElementById('shift-today-work');
      if(elTodayWork){
        elTodayWork.textContent = formatDurationHuman(getCallerTodayTotalActiveSec(S.role));
      }
      const elDeskToday = document.getElementById('desk-today-work');
      if(elDeskToday){
        elDeskToday.textContent = formatDurationHuman(getCallerTodayTotalActiveSec(S.role));
      }
    }
  } else {
    if(S.tab === 'timers'){
      ['A','B','C'].forEach(c => {
        const sh = SHIFTS[c];
        const elTimer = document.getElementById(`adm-timer-${c}`);
        if(elTimer){
          if(sh.status === 'running'){
            elTimer.textContent = formatHMS(getCallerActiveSeconds(c));
          } else if(sh.status === 'break'){
            elTimer.textContent = `Break: ${formatHMS(getCallerBreakSeconds(c))}`;
          } else {
            elTimer.textContent = 'Offline';
          }
        }
        const elToday = document.getElementById(`adm-today-${c}`);
        if(elToday){
          elToday.textContent = formatDurationHuman(getCallerTodayTotalActiveSec(c));
        }
      });
    }
  }
}, 1000);

render();

/* ======================= Real-time Cross-Tab & Multi-Device Sync ======================= */
const CRM_SYNC_CHANNEL = (typeof BroadcastChannel !== 'undefined') ? new BroadcastChannel('vgds_crm_realtime_sync') : null;

function broadcastSync(action, payload = {}) {
  try {
    if (CRM_SYNC_CHANNEL) {
      CRM_SYNC_CHANNEL.postMessage({ action, payload, role: S.role, time: Date.now() });
    }
  } catch (e) {}
}

let lastServerSyncTime = 0;
async function pushStateToServer() {
  try {
    if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
    const body = JSON.stringify({
      leads: LEADS,
      recordings: RECORDINGS.map(r => ({ ...r, url: r.serverUrl || r.url })),
      shifts: SHIFTS,
      skippedLogs: SKIPPED_LOGS,
      skippedLeads: [...SKIPPED_LEADS]
    });
    const res = await fetch('/api/sync/state', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body
    });
    if (res.ok) {
      const d = await res.json();
      if (d.updatedAt) lastServerSyncTime = d.updatedAt;
    }
  } catch (e) {}
}

async function pullStateFromServer() {
  try {
    if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
    const res = await fetch('/api/sync/state');
    if (!res.ok) return;
    const d = await res.json();
    if (d && d.updatedAt && d.updatedAt > lastServerSyncTime) {
      lastServerSyncTime = d.updatedAt;
      let hasChanges = false;
      if (Array.isArray(d.leads) && d.leads.length > 0) {
        LEADS = d.leads;
        saveStorage();
        hasChanges = true;
      }
      if (Array.isArray(d.recordings)) {
        RECORDINGS = d.recordings;
        saveRecordingsToStorage();
        hasChanges = true;
      }
      if (d.shifts && typeof d.shifts === 'object') {
        SHIFTS = d.shifts;
        saveShifts();
        hasChanges = true;
      }
      if (Array.isArray(d.skippedLogs)) {
        SKIPPED_LOGS = d.skippedLogs;
        saveSkippedLogs();
        hasChanges = true;
      }
      if (Array.isArray(d.skippedLeads)) {
        SKIPPED_LEADS = new Set(d.skippedLeads);
        saveSkippedLeads();
        hasChanges = true;
      }
      if (hasChanges && S.role) {
        renderTab();
      }
    }
  } catch (e) {}
}

// Background sync loop (every 3 seconds for Admin, every 5 seconds for Callers)
setInterval(() => {
  if (S.role === 'admin') {
    pullStateFromServer();
  }
}, 3000);

// Cross-tab real-time listener (instant 0ms update across tabs)
if (CRM_SYNC_CHANNEL) {
  CRM_SYNC_CHANNEL.onmessage = (ev) => {
    loadStorage();
    loadRecordingsFromStorage();
    loadShifts();
    loadSkippedLeads();
    loadSkippedLogs();
    if (S.role) {
      renderTab();
    }
  };
}

window.addEventListener('storage', (ev) => {
  if (ev.key === STORAGE_KEY || ev.key === REC_STORAGE_KEY || ev.key === SHIFT_STORAGE_KEY || ev.key === SKIPPED_STORAGE_KEY || ev.key === SKIPPED_LOGS_KEY) {
    loadStorage();
    loadRecordingsFromStorage();
    loadShifts();
    loadSkippedLeads();
    loadSkippedLogs();
    if (S.role) {
      renderTab();
    }
  }
});

</script>
