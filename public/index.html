<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>Victor Growth Calling CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: white canvas, brand navy used only for type, brand green for action; light tints carry state. Single light theme by client request. */
:root{
  color-scheme: light;
  --bg:#FFFFFF;
  --surface:#F7F9FC;
  --surface-2:#EEF3F9;
  --line:#E2E9F2;
  --ink:#10305F;
  --ink-2:#55657E;
  --ink-3:#8593A8;
  --green:#17A34A;
  --green-600:#12873C;
  --green-soft:#E8F7EE;
  --navy-soft:#EAF0FA;
  --cA:#2F66D0; --cA-soft:#E8EFFC;
  --cB:#17A34A; --cB-soft:#E8F7EE;
  --cC:#E3961A; --cC-soft:#FDF3E2;
  --warn:#B3261E; --warn-soft:#FDECEC;
  --font-display:"Outfit", "Segoe UI", system-ui, sans-serif;
  --font-body:"Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r-sm:8px; --r:12px; --r-lg:16px;
  --shadow:0 1px 2px rgba(16,48,95,.05), 0 6px 20px rgba(16,48,95,.06);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.ic{flex:none;display:block}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- Portal Gateway (Refined Topbar & Centered Desks) ---------- */
.portal-topbar{width:100%;max-width:1160px;display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border:1px solid var(--line);border-radius:var(--r-lg);background:#fff;margin-bottom:12px;box-shadow:0 2px 8px rgba(16,48,95,.03)}
.portal-brand{display:flex;align-items:center;gap:14px}
.portal-brand .logo{height:46px;width:auto;object-fit:contain}
.portal-brand-text{display:flex;flex-direction:column;gap:2px}
.portal-brand-text b{font-family:var(--font-display);font-size:16px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.portal-brand-text span{font-size:11.5px;font-weight:600;color:var(--green-600);letter-spacing:.03em}
.portal-system-pill{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);padding:6px 14px;border-radius:999px;font-size:12px;font-weight:600;color:var(--ink-2)}
.portal-system-pill i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(23,163,74,.18)}

.portal{padding-block:16px 44px;display:flex;flex-direction:column;align-items:center;gap:28px;width:100%}
.portal-head{text-align:center;display:grid;gap:8px;max-width:760px}
.portal-head .gateway-badge{display:inline-flex;align-items:center;gap:7px;background:var(--navy-soft);color:var(--ink);font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 14px;border-radius:999px;margin:0 auto 2px}
.portal-head h1{font-size:32px;font-weight:700;color:var(--ink);letter-spacing:-.02em;line-height:1.2;margin:0}
.portal-head p{margin:0;color:var(--ink-2);font-size:15px;line-height:1.5}

.portal-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;width:100%;max-width:1160px}
@media (max-width: 980px){.portal-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width: 560px){.portal-grid{grid-template-columns:1fr}}

.pcard{all:unset;box-sizing:border-box;cursor:pointer;background:var(--bg);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:24px 22px 20px;display:flex;flex-direction:column;gap:14px;transition:border-color .18s, box-shadow .18s, transform .18s;min-height:250px;box-shadow:0 2px 6px rgba(16,48,95,.03)}
.pcard:hover{border-color:var(--green);box-shadow:0 12px 28px rgba(16,48,95,.08);transform:translateY(-3px)}
.pcard:focus-visible{outline:2px solid var(--green);outline-offset:3px}
.pcard .card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pcard .badge-ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center}
.pcard .role-tag{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
.pcard h2{font-size:20px;font-weight:700;color:var(--ink);margin:0}
.pcard p{margin:0;color:var(--ink-2);font-size:13px;line-height:1.45}
.pcard .meta{margin-top:auto;display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--line);padding-top:14px;font-size:12.5px;color:var(--ink-2)}
.pcard .go{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--green-600);font-size:13px}
.pcard.admin{background:linear-gradient(180deg,#F2FAF5,var(--bg) 65%);border-color:#CFEBD9}
.pcard.admin:hover{border-color:var(--green)}

.demo-note{font-size:12.5px;color:var(--ink-2);text-align:center;display:flex;gap:8px 16px;flex-wrap:wrap;justify-content:center;align-items:center;padding:12px 22px;background:var(--surface);border:1px solid var(--line);border-radius:12px;max-width:760px}
.demo-note code{font-family:var(--font-body);font-weight:700;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 8px}

/* ---------- Passcode modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(16,48,95,.14);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--bg);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 60px rgba(16,48,95,.18);width:min(400px,100%);padding:28px 26px 22px;display:grid;gap:18px;text-align:center}
.modal .lock{width:52px;height:52px;border-radius:14px;margin:0 auto;display:grid;place-items:center;background:var(--green-soft);color:var(--green-600)}
.modal h3{font-size:21px;font-weight:600}
.pins{display:flex;gap:12px;justify-content:center}
.pins input{width:54px;height:62px;text-align:center;font-size:26px;font-family:var(--font-display);font-weight:600;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);transition:border-color .15s, background .15s}
.pins input:focus{outline:none;border-color:var(--green);background:var(--bg)}
.pins.err input{border-color:var(--warn);background:var(--warn-soft)}
.pins.err{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.err-msg{color:var(--warn);font-size:13px;min-height:20px}
.modal .row{display:flex;gap:10px}
.modal .row .btn{flex:1;justify-content:center}

/* ---------- Buttons / inputs ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:8px 14px;font-weight:500;font-size:13.5px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-600)}
.btn.soft{background:var(--green-soft);border-color:#CDEBD8;color:var(--green-600)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.input,.select,textarea.input{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px 12px;font-size:13.5px;min-width:0}
.input:focus,.select:focus{outline:none;border-color:var(--green)}
.select{padding-right:28px}

/* ---------- App shell ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.topbar .logo{height:40px;width:auto}
.role-pill{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border-radius:999px;font-weight:600;font-size:13px}
.role-pill .av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-family:var(--font-display)}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.live-dot{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--green-600)}
.live-dot i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(23,163,74,.5);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(23,163,74,0)}100%{box-shadow:0 0 0 0 rgba(23,163,74,0)}}
.clock{font-size:13px;color:var(--ink-2)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:12px 14px 11px;color:var(--ink-2);font-weight:500;border-bottom:2.5px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-color:var(--green);font-weight:600}
.tab:focus-visible{outline:2px solid var(--green);outline-offset:-2px;border-radius:6px}
.tab .count{background:var(--surface-2);color:var(--ink-2);border-radius:999px;padding:0 7px;font-size:11.5px;font-weight:600}
.tab .count.hot{background:var(--warn-soft);color:var(--warn)}
main.wrap{padding-block:24px 56px;display:grid;gap:22px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-head h1{font-size:24px;font-weight:600}
.page-head p{margin:2px 0 0;color:var(--ink-2)}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}

.panel{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.panel-h h3{font-size:16px;font-weight:600}
.grid-2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.kpi{background:var(--surface);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px;min-width:0}
.kpi .lbl{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.kpi .lbl i{width:8px;height:8px;border-radius:2px;display:inline-block}
.kpi .val{font-family:var(--font-display);font-size:28px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:11.5px;color:var(--ink-3)}

/* Status pills */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-NC{background:#EEF2F7;color:#5A6B85}
.s-NR{background:#FFF3DA;color:#946000}
.s-NRCH{background:#FDEBE2;color:#AE4718}
.s-INT{background:#E3F6E9;color:#127534}
.s-CB{background:#E5EFFD;color:#1E57B0}
.s-NI{background:#FCE9EA;color:#B3261E}
.s-FU{background:#EFE9FD;color:#6739C2}
.s-CONV{background:var(--green);color:#fff}
.s-CONV::before{background:#fff}

/* Caller cards */
.ccard{border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;display:grid;gap:14px;background:var(--bg);min-width:0}
.ccard-top{display:flex;align-items:center;gap:12px}
.avatar{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:17px;flex:none}
.ccard h4{font-size:16px;font-weight:600}
.state{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.state i{width:7px;height:7px;border-radius:50%}
.st-call{color:var(--green-600)} .st-call i{background:var(--green);animation:pulse 1.8s infinite}
.st-active{color:#1E57B0} .st-active i{background:#2F66D0}
.st-idle{color:var(--ink-3)} .st-idle i{background:#B6C1D1}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.mini-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mini-stats div{display:grid}
.mini-stats b{font-family:var(--font-display);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.mini-stats span{font-size:11px;color:var(--ink-3)}
.last-act{font-size:12.5px;color:var(--ink-2);background:var(--surface);border-radius:8px;padding:8px 10px}

/* Summary */
.sum{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:18px}
.big-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.bk{border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;display:flex;gap:14px;align-items:center;background:var(--bg);min-width:0}
.bk .ib{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;flex:none}
.bk .v{font-family:var(--font-display);font-size:32px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.bk .l{font-weight:600;font-size:13.5px;margin-top:4px}
.bk .s{font-size:12px;color:var(--ink-3)}
.orows{display:grid;gap:10px}
.orow{display:grid;grid-template-columns:minmax(0,1fr) auto 44px;gap:4px 10px;align-items:center;font-size:13px}
.orow .nm{display:flex;align-items:center;gap:8px}
.orow .nm i{width:9px;height:9px;border-radius:3px;flex:none}
.orow b{font-variant-numeric:tabular-nums}
.orow .pc{color:var(--ink-3);text-align:right;font-size:12px;font-variant-numeric:tabular-nums}
.orow .track{grid-column:1/-1;height:6px;background:var(--surface-2);border-radius:9px;overflow:hidden}
.orow .track span{display:block;height:100%;border-radius:9px}

/* Caller phones */
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sec-h h2{font-size:19px;font-weight:600}
.phones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;padding:30px 20px 24px;background:linear-gradient(180deg,var(--surface),var(--bg));border:1px solid var(--line);border-radius:24px}
.phone-wrap{display:grid;justify-items:center;gap:12px;min-width:0}
.phone{width:100%;max-width:292px;border-radius:46px;background:#FFFFFF;padding:9px;border:1px solid #D6E0EC;box-shadow:0 26px 50px -14px rgba(16,48,95,.20),inset 0 0 0 5px #F1F5FA}
.screen{border-radius:38px;background:#FBFCFE;border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
.sbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 20px 4px;font-size:11.5px;font-weight:600}
.island{width:76px;height:22px;border-radius:99px;background:#E4EAF2}
.sbar .r{justify-self:end;display:flex;gap:5px;align-items:center;color:var(--ink-2);font-size:10.5px}
.sig{display:inline-flex;gap:1.5px;align-items:flex-end}
.sig i{width:3px;border-radius:1px;background:var(--ink-2)}
.p-head{display:flex;align-items:center;gap:10px;padding:12px 16px}
.p-head .avatar{width:38px;height:38px;font-size:16px}
.p-head b{font-family:var(--font-display);font-size:16px;font-weight:600;display:block;line-height:1.2}
.p-body{padding:0 12px 10px;display:grid;gap:9px}
.ring-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;align-items:center;gap:12px}
.ring-card .t{display:grid;gap:2px;font-size:12px;color:var(--ink-2);min-width:0}
.ring-card .t b{color:var(--ink);font-size:14px}
.p-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pt{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 4px 7px;text-align:center;display:grid;gap:1px;min-width:0}
.pt b{font-family:var(--font-display);font-size:20px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.pt span{font-size:10.5px;color:var(--ink-2);line-height:1.2}
.p-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:4px}
.p-cap{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);display:flex;justify-content:space-between;gap:6px}
.p-row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.p-row:first-of-type{border-top:0}
.p-row .who{min-width:0;display:grid}
.p-row .who b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:12.5px}
.p-row .who span{font-size:11px;color:var(--ink-3)}
.p-row .pill,.p-card .pill{font-size:10.5px;padding:1px 8px}
.p-btn{all:unset;cursor:pointer;text-align:center;font-weight:600;font-size:12.5px;color:var(--green-600);background:var(--green-soft);border-radius:12px;padding:9px}
.p-btn:focus-visible{outline:2px solid var(--green)}
.home-ind{width:108px;height:5px;border-radius:9px;background:#D3DCE8;margin:2px auto 10px}
.phone-label{font-size:13px;color:var(--ink-2)}

/* Feed */
.feed{display:grid;max-height:440px;overflow:auto}
.feed-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.feed-row:last-child{border-bottom:0}
.feed-row .avatar{width:30px;height:30px;font-size:13px;border-radius:9px}
.feed-row .what{font-size:13px;min-width:0}
.feed-row .what b{font-weight:600}
.feed-row .when{font-size:12px;color:var(--ink-3);white-space:nowrap}
.feed-row.new{animation:flash 2.4s}
@keyframes flash{0%{background:var(--green-soft)}100%{background:transparent}}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:600;text-align:left;background:var(--surface);padding:10px 12px;white-space:nowrap;position:sticky;top:0;z-index:1}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle;white-space:nowrap}
td.wrap-txt{white-space:normal;min-width:180px}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface)}
tr.sel td{background:#F2FAF5}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl-scroll{max-height:520px;overflow:auto}
.lead-cell b{display:block;font-weight:600}
.lead-cell span{font-size:12px;color:var(--ink-2)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1 1 200px}
.bulk{display:flex;gap:8px;align-items:center;background:var(--green-soft);border:1px solid #CDEBD8;border-radius:10px;padding:6px 8px 6px 12px;font-size:13px;font-weight:500;color:var(--green-600)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{all:unset;cursor:pointer;padding:6px 14px;border-radius:8px;font-weight:500;font-size:13px;color:var(--ink-2)}
.seg button.on{background:var(--bg);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(16,48,95,.12)}
.seg button:focus-visible{outline:2px solid var(--green)}

<script>
/* ======================= Icons ======================= */

};
const ic=(n,s=18)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ======================= Config ======================= */
const PASS={admin:['1313','4090'],A:['0000','1111'],B:['0000','2222'],C:['0000','3333']};
const CALLERS={
  A:{name:'Caller A',color:'var(--cA)',soft:'var(--cA-soft)',hex:'#2F66D0'},
  B:{name:'Caller B',color:'var(--cB)',soft:'var(--cB-soft)',hex:'#17A34A'},
  C:{name:'Caller C',color:'var(--cC)',soft:'var(--cC-soft)',hex:'#E3961A'},
};
const ST={
  NC:{label:'Not Called',hex:'#8C9AB0'},
  NR:{label:'Call Not Received',hex:'#E3A21A'},
  NRCH:{label:'Number Not Reachable',hex:'#E06A35'},
  INT:{label:'Interested / Serious Client',hex:'#17A34A'},
  CB:{label:'Interested but Busy – Call Back Later',hex:'#2F66D0'},
  NI:{label:'Not Interested',hex:'#D9534F'},
  FU:{label:'Follow-Up Required',hex:'#7B4FD6'},
};
const SHORT={NC:'Not Called',NR:'Not Received',NRCH:'Not Reachable',INT:'Interested',CB:'Call Back Later',NI:'Not Interested',FU:'Follow-Up'};
const pill=(s,short=true)=>`<span class="pill s-${s}">${short?SHORT[s]:ST[s].label}</span>`;
const RECEIVED=['INT','CB','NI','FU'];
const DAY=864e5;

/* ======================= Sample data ======================= */
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(20261123);
const pick=a=>a[Math.floor(R()*a.length)];
const wpick=w=>{const tot=Object.values(w).reduce((a,b)=>a+b,0);let r=R()*tot;for(const k in w){r-=w[k];if(r<=0)return k}return Object.keys(w)[0]};
const FIRST=['Aarti','Rohan','Neha','Vikram','Priya','Karan','Sneha','Arjun','Meera','Rahul','Ananya','Siddharth','Kavya','Aditya','Pooja','Nikhil','Ishita','Varun','Ritika','Manish','Tanvi','Harsh','Simran','Kunal','Divya','Abhishek','Nisha','Gaurav','Shruti','Amit','Riya','Yash'];
const LAST=['Sharma','Mehta','Kapoor','Verma','Malhotra','Gupta','Bansal','Arora','Jain','Chopra','Khanna','Singh','Agarwal','Reddy','Nair','Desai','Iyer','Bhatia','Sethi','Joshi'];
const BRAND=['Aura','Nest','Studio Vaastu','Canvas','Ivory','Linea','Terra','Oak & Arch','Habitat','Monarch','Urban Loft','Kaya','Elan','Prism','Saffron','Haveli','Atelier','Mosaic','Nook','Verve','Alcove','Panache','Zen','Cedar','Aangan','Morph','Folio','Luxe'];
const SUFFIX=['Interiors','Design Studio','Spaces','Decor','Interior Studio','Design Co.','Living','Interiors & Build'];
const CITIES=['Delhi','Gurugram','Noida','Mumbai','Pune','Bengaluru','Jaipur','Chandigarh','Ahmedabad','Hyderabad','Lucknow','Indore'];
const SPEC=['modular kitchens','luxury residences','office fit-outs','3BHK turnkey projects','restaurant & café interiors','villa interiors','retail showrooms','budget home makeovers','wardrobes & false ceilings','hospitality projects'];
const REMARK={
 NR:['Ring went full, no answer.','No response, try evening.','Phone rang, cut automatically.'],
 NRCH:['Switched off.','"Number not reachable" message.','Out of coverage area.'],
 INT:['Wants a proposal for Google Ads + Instagram. Send portfolio deck on WhatsApp.','Very keen — asked for pricing of the lead-gen package.','Meeting fixed with the founder. Budget ₹40–60k/month.','Interested in a new website + SEO. Asked for case studies.'],
 CB:['In a site visit, asked to call after 5 pm.','Busy in a client meeting, call tomorrow morning.','Driving, said call back on Monday.','Interested but travelling, call next week.'],
 NI:['Already working with an agency.','Gets enough work from referrals.','Not doing marketing this year.','Said budget is too tight right now.'],
 FU:['Asked to share details on WhatsApp first, follow up after 2 days.','Partner decides, follow up after discussing.','Sent email, follow up for feedback.','Wants to see results of similar studios.'],
};
const now0=Date.now();
const dayStart=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const atHour=(dayT,h,m)=>{const d=new Date(dayT);d.setHours(h,m,0,0);return d.getTime()};
const phoneFmt=n=>`+91 ${n.slice(0,5)} ${n.slice(5)}`;
const digits=s=>String(s||'').replace(/\D/g,'').slice(-10);

let LEADS = [];
let RECORDINGS = [];
let SEQ = 1;

function makeLead(caller){
  const f=pick(FIRST), l=pick(LAST), b=pick(BRAND), suf=pick(SUFFIX), city=pick(CITIES), spec=pick(SPEC);
  const company=`${b} ${suf}`;
  const slug=b.toLowerCase().replace(/[^a-z]/g,'');
  const num=String(7+Math.floor(R()*3))+String(Math.floor(R()*1e9)).padStart(9,'0');
  const yrs=2+Math.floor(R()*14), ig=(1+R()*24).toFixed(1), rating=(3.8+R()*1.2).toFixed(1), rev=12+Math.floor(R()*240);
  const siteOk=R()>.3;
  return {
    id:SEQ++, name:`${f} ${l}`, first:f, company, phone:num, city,
    website: siteOk?`https://www.${slug}${suf.split(' ')[0].toLowerCase().replace(/[^a-z]/g,'')}.in`:'',
    hook:`Hi ${f}, I came across ${company}'s work on ${spec} in ${city}. We help interior studios get 15–20 qualified project enquiries every month through Google and Instagram. Can I take 2 minutes to show you how?`,
    details:[`Specialises in ${spec}`,`${yrs} years in business · ${city}`,`Instagram: ${ig}k followers`,`Google rating ${rating}★ (${rev} reviews)`, siteOk?'Website live, no enquiry form on homepage':'No website — only Instagram & JustDial listing'],
    caller, status:'NC', history:[], followUp:null, convertedAt:null, source:'Manual Entry'
  };
}

// Persistent Storage: Clean State (0 Fake Leads)
const STORAGE_KEY = 'vgds_crm_leads_v9';
const REC_STORAGE_KEY = 'vgds_crm_recordings_v5';

function saveStorage(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(LEADS));
    localStorage.setItem('vgds_crm_seq_v9', String(SEQ));
  }catch(e){}
}
function loadStorage(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      LEADS = JSON.parse(raw) || [];
      SEQ = +(localStorage.getItem('vgds_crm_seq_v9') || (LEADS.length + 1));
      return true;
    }
  }catch(e){}
  return false;
}

function saveRecordingsToStorage(){
  try{ localStorage.setItem(REC_STORAGE_KEY, JSON.stringify(RECORDINGS)); }catch(e){}
}
function loadRecordingsFromStorage(){
  try{
    const raw = localStorage.getItem(REC_STORAGE_KEY);
    if(raw){ RECORDINGS = JSON.parse(raw) || []; }
  }catch(e){ RECORDINGS = []; }
}
loadRecordingsFromStorage();

(function seed(){
  if(!loadStorage()){
    LEADS = [];
    SEQ = 1;
    saveStorage();
  }
})();

function resetActivityMetrics(){
  if(confirm('Clear all calling data and start completely fresh? This will reset all queues to 0.')){
    LEADS = [];
    RECORDINGS = [];
    SEQ = 1;
    saveStorage();
    saveRecordingsToStorage();
    toast('CRM reset: All data cleared. Ready for fresh entries or sheet upload.');
    render();
  }
}

/* ======================= Helpers ======================= */
const fmtTime=t=>new Date(t).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'});
const fmtDate=t=>new Date(t).toLocaleDateString('en-IN',{day:'numeric',month:'short'});
const fmtDT=t=>{const d=dayStart(t),td=dayStart(Date.now());const p=d===td?'Today':d===td+DAY?'Tomorrow':d===td-DAY?'Yesterday':fmtDate(t);return `${p}, ${fmtTime(t)}`};
const ago=t=>{const m=Math.round((Date.now()-t)/60e3);if(m<1)return'just now';if(m<60)return`${m} min ago`;const h=Math.floor(m/60);if(h<24)return`${h} hr ago`;return fmtDate(t)};
const leadById=id=>LEADS.find(l=>l.id===id);
const allEntries=()=>LEADS.flatMap(l=>l.history.map(e=>({...e,lead:l}))).sort((a,b)=>b.t-a.t);
const isDue=l=>l.followUp && (l.status==='CB'||l.status==='FU') && l.followUp<=Date.now();
const pendingFU=l=>l.followUp && (l.status==='CB'||l.status==='FU');

function stats(c,from,to){
  const mine=LEADS.filter(l=>l.caller===c);
  const es=[];LEADS.forEach(l=>l.history.forEach(e=>{if(e.by===c&&e.t>=from&&e.t<to)es.push({...e,id:l.id})}));
  const uniq=new Set(es.map(e=>e.id));
  const intLeads=new Set(es.filter(e=>e.status==='INT').map(e=>e.id));
  const days=Math.max(1,Math.round((Math.min(to,Date.now())-from)/DAY)||1);
  const conv=mine.filter(l=>l.convertedAt&&l.convertedAt>=from&&l.convertedAt<to).length;
  return {
    assigned:mine.length, calls:es.length, unique:uniq.size,
    received:es.filter(e=>RECEIVED.includes(e.status)).length,
    notReceived:es.filter(e=>e.status==='NR'||e.status==='NRCH').length,
    interested:intLeads.size, callbacks:es.filter(e=>e.status==='CB').length,
    pending:mine.filter(pendingFU).length, due:mine.filter(isDue).length,
    notInterested:es.filter(e=>e.status==='NI').length,
    converted:conv, remaining:mine.filter(l=>l.status==='NC').length,
    done:mine.filter(l=>l.status!=='NC').length,
    avg:+(es.length/days).toFixed(1), rate:uniq.size?Math.round(intLeads.size/uniq.size*100):0,
  };
}
const todayRange=()=>[dayStart(Date.now()),Date.now()+1];
function lastAct(c){let best=null;LEADS.forEach(l=>l.history.forEach(e=>{if(e.by===c&&(!best||e.t>best.t))best={...e,lead:l}}));return best}
function callerState(c){const a=lastAct(c);if(!a)return['st-idle','Offline'];const m=(Date.now()-a.t)/60e3;return m<4?['st-call','On a call']:m<25?['st-active','Active']:['st-idle','Idle']}

function openPass(role){
  const title=role==='admin'?'Admin Portal':CALLERS[role].name;
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<form class="modal" id="pass-form" autocomplete="off">
    <div class="lock">${ic('lock',24)}</div>
    <div style="display:grid;gap:4px"><h3>${title}</h3><p class="muted" style="margin:0">Enter your 4-digit passcode</p></div>
    <div class="pins" id="pins">${[0,1,2,3].map(i=>`<input id="pin-${i}" inputmode="numeric" maxlength="1" type="password" aria-label="Digit ${i+1}">`).join('')}</div>
    <div class="err-msg" id="pin-err"></div>
    <div class="row"><button type="button" class="btn" id="pin-cancel">Cancel</button><button class="btn primary" id="pin-go">Unlock ${ic('arrow',16)}</button></div>
  </form>`;
  document.body.appendChild(ov);
  const ins=[...ov.querySelectorAll('.pins input')];ins[0].focus();
  const close=()=>ov.remove();
  ov.addEventListener('click',e=>{if(e.target===ov)close()});
  ov.querySelector('#pin-cancel').onclick=close;
  ins.forEach((inp,i)=>{
    inp.addEventListener('input',()=>{inp.value=inp.value.replace(/\D/g,'').slice(-1);if(inp.value&&i<3)ins[i+1].focus();if(ins.every(x=>x.value))submit()});
    inp.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!inp.value&&i>0)ins[i-1].focus();if(e.key==='Escape')close()});
    inp.addEventListener('paste',e=>{const d=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,4);if(d.length===4){e.preventDefault();d.split('').forEach((c,k)=>ins[k].value=c);submit()}});
  });
  function submit(){
    const code=ins.map(x=>x.value).join('');
    const ok = Array.isArray(PASS[role]) ? PASS[role].includes(code) : code === PASS[role];
    if(ok){close();login(role)}
    else{const p=ov.querySelector('#pins');p.classList.remove('err');void p.offsetWidth;p.classList.add('err');ov.querySelector('#pin-err').textContent='Wrong passcode. Try again.';ins.forEach(x=>x.value='');ins[0].focus()}
  }
  ov.querySelector('form').addEventListener('submit',e=>{e.preventDefault();submit()});
}
function login(role){
  S.role=role;S.tab=role==='admin'?'dispatch':'desk';
  if(role!=='admin'){S.desk={idx:firstQueueIdx(role),status:null,remark:'',fu:'',conv:false};const d=LEADS.filter(l=>l.caller===role&&isDue(l)).length;if(d)setTimeout(()=>toast(`${d} follow-up${d>1?'s are':' is'} due now — see the Follow-ups tab.`),400)}
  render();window.scrollTo(0,0);
}

function tickClock(){const c=document.getElementById('clock');if(c)c.textContent=new Date().toLocaleString('en-IN',{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}
setInterval(tickClock,20e3);
function renderTab(){
  const m=document.getElementById('main');
  const f={dispatch:aDispatch,live:aLive,leads:aLeads,recordings:aRecordings,reports:aReports,history:aHistory,desk:cDesk,mine:cMine,follow:cFollow,perf:cPerf}[S.tab];
  if(f) f(m);
}
const av=(c,s='')=>`<span class="avatar ${s}" style="background:${CALLERS[c].soft};color:${CALLERS[c].color}">${c}</span>`;

/* ======================= ADMIN: Live ======================= */
const OUT_LABEL={INT:'Interested',CB:'Busy – call back later',FU:'Follow-up required',NI:'Not interested',NR:'Call not received',NRCH:'Number not reachable'};
const bk=(icon,bg,fg,v,l,s)=>`<div class="bk"><span class="ib" style="background:${bg};color:${fg}">${ic(icon,22)}</span><div style="min-width:0"><div class="v">${v}</div><div class="l">${l}</div><div class="s">${s}</div></div></div>`;
function phoneScreen(c){
  const t=todayRange(), s=stats(c,...t), a=lastAct(c), [cls,lbl]=callerState(c), C=CALLERS[c];
  const pct=s.assigned?Math.round(s.done/s.assigned*100):0, R2=34, circ=2*Math.PI*R2;
  const mine=[];LEADS.forEach(l=>l.history.forEach(e=>{if(e.by===c&&e.t>=t[0])mine.push({...e,lead:l})}));
  mine.sort((x,y)=>y.t-x.t);
  const tile=(v,l,col)=>`<div class="pt"><b style="color:${col||'var(--ink)'}">${v}</b><span>${l}</span></div>`;
  return `<div class="phone-wrap"><div class="phone" role="img" aria-label="${C.name} phone screen"><div class="screen">
    <div class="sbar"><span class="num">${new Date().toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit',hour12:false})}</span><span class="island"></span>
      <span class="r"><span class="sig"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:10px"></i></span>5G</span></span></div>
    <div class="p-head">${av(c)}<div style="flex:1;min-width:0"><b>${C.name}</b><span class="state ${cls}"><i></i>${lbl}</span></div></div>
    <div class="p-body">
      <div class="ring-card">
        <svg width="84" height="84" viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="${R2}" fill="none" stroke="#E8EEF6" stroke-width="8"/><circle cx="42" cy="42" r="${R2}" fill="none" stroke="${C.hex}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${circ*pct/100} ${circ}" transform="rotate(-90 42 42)"/><text x="42" y="48" text-anchor="middle" font-size="18" font-weight="600" fill="#10305F" font-family="Outfit, sans-serif">${pct}%</text></svg>
        <div class="t"><span>Data completed</span><b class="num">${s.done} of ${s.assigned} leads</b><span class="num">${s.remaining} left to call</span></div>
      </div>
      <div class="p-cap" style="padding:2px 2px 0"><span>Today</span><span class="num">${s.rate}% conversion</span></div>
      <div class="p-tiles">
        ${tile(s.calls,'Calls made')}${tile(s.received,'Picked up','#127534')}${tile(s.notReceived,'Not picked','#AE4718')}
        ${tile(s.interested,'Interested','#127534')}${tile(s.notInterested,'Not interested','#B3261E')}${tile(s.pending,'Follow-ups','#1E57B0')}
      </div>
      <div class="p-card"><div class="p-cap"><span>${cls==='st-call'?'On call now':'Last call'}</span><span>${a?ago(a.t):''}</span></div>
        ${a?`<div class="p-row"><div class="who"><b>${esc(a.lead.company)}</b><span>${esc(a.lead.name)}</span></div>${pill(a.status)}</div>`:'<span class="faint" style="font-size:12px">No calls yet today</span>'}</div>
      <div class="p-card"><div class="p-cap"><span>Earlier today</span><span class="num">${Math.max(0,mine.length-1)} calls</span></div>
        ${mine.slice(1,4).map(e=>`<div class="p-row"><div class="who"><b>${esc(e.lead.company)}</b><span class="num">${fmtTime(e.t)}</span></div>${pill(e.status)}</div>`).join('')||'<span class="faint" style="font-size:12px">Nothing else yet</span>'}</div>
      <button class="p-btn" data-rep="${c}">Open full report</button>
    </div>
    <div class="home-ind"></div>
  </div></div><span class="phone-label">${C.name} · ${s.assigned} leads assigned</span></div>`;
}
/* ======================= ADMIN: Dispatch & Daily Upload ======================= */
function aDispatch(m){
  const un=LEADS.filter(l=>!l.caller).length;
  const r=S.importRes;
  const callerStats = ['A','B','C'].map(c=>({
    c,
    name: CALLERS[c].name,
    total: LEADS.filter(l=>l.caller===c).length,
    uncalled: LEADS.filter(l=>l.caller===c && l.status==='NC').length,
    callsToday: LEADS.filter(l=>l.history.some(e=>e.by===c && e.t>=todayRange()[0])).length
  }));
  
  m.innerHTML=`
  <div class="page-head">
    <div>
      <h1>Daily Sheet Upload & Team Dispatch</h1>
      <p>Import your daily calling Excel sheet (.xlsx or .csv), automatically filter duplicate numbers, and dispatch fresh leads to caller queues.</p>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn soft" id="dsp-sample-btn">${ic('file',16)} Load Sample Sheet</button>
      <button class="btn" style="color:var(--warn);border-color:#F8D7DA" id="dsp-reset-act">${ic('history',16)} Reset Today's Metrics (0 Calls)</button>
    </div>
  </div>

  <section class="panel">
    <div class="panel-h">
      <h3>1. Select or Drop Daily Calling File</h3>
      <span class="faint">Supports Microsoft Excel (.xlsx, .xls) and CSV (.csv)</span>
    </div>
    <label class="drop" id="dsp-drop" for="dsp-file-in">
      <div class="ic-box" style="background:var(--green-soft);color:var(--green-600)">${ic('upload',28)}</div>
      <div class="txt">
        <b style="font-size:16px">Click to browse or drag & drop today's calling sheet here</b>
        <div class="muted" style="font-size:13px;margin-top:4px">Deduplication engine checks phone numbers against all <b>${LEADS.length}</b> existing leads in CRM.</div>
        <div class="cols-hint" style="margin-top:10px">
          <span>Contact Name</span>
          <span>Company / Studio</span>
          <span>Phone / Mobile</span>
          <span>City</span>
          <span>Website</span>
          <span>Calling Hook / Pitch</span>
          <span>Business Details</span>
        </div>
      </div>
      <input type="file" id="dsp-file-in" accept=".csv,.xlsx,.xls" hidden>
    </label>

    ${r ? `
    <div class="import-res" style="margin-top:20px">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <div style="display:flex;align-items:center;gap:10px">
          <div class="badge-ic" style="background:var(--cA-soft);color:var(--cA);width:36px;height:36px">${ic('file',18)}</div>
          <div><b style="font-size:15px">${esc(r.file)}</b><div class="faint" style="font-size:12px">Processed just now</div></div>
        </div>
        <button class="btn sm" id="dsp-discard">Discard File</button>
      </div>

      <div class="res-stats" style="margin-block:16px">
        <div><span class="faint">Total Rows Detected</span><b class="num">${r.total}</b></div>
        <div style="background:var(--green-soft)"><span class="faint">Clean & Fresh Leads</span><b class="num" style="color:var(--green-600)">${r.fresh.length}</b></div>
        <div style="background:var(--warn-soft)"><span class="faint">Duplicate / Invalid Skipped</span><b class="num" style="color:var(--warn)">${r.dupes.length}</b></div>
      </div>

      ${r.dupes.length ? `
      <div style="max-height:160px;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;display:grid;gap:6px;margin-bottom:16px">
        <div class="faint" style="font-size:11.5px;font-weight:700;text-transform:uppercase">Duplicates filtered out:</div>
        ${r.dupes.slice(0,10).map(d=>`<div class="dupe" style="font-size:12.5px">${ic('phone',13)}<b class="num">${phoneFmt(d.phone)}</b> · ${esc(d.company||d.name||'Unknown')} <span style="margin-left:auto;color:var(--warn);font-size:11.5px">${esc(d.why)}</span></div>`).join('')}
        ${r.dupes.length>10?`<div class="faint" style="font-size:11.5px">+ ${r.dupes.length-10} more duplicate entries skipped</div>`:''}
      </div>` : ''}

      <div class="panel-h" style="padding:0;margin-bottom:12px">
        <h4>Dispatch Destination:</h4>
        <span class="faint">Choose how to allocate these ${r.fresh.length} new leads</span>
      </div>

      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px">
        <button class="btn primary" id="dsp-auto-split" ${r.fresh.length?'':'disabled'} style="justify-content:center;padding:12px">
          ${ic('users',18)} Split Equally (Caller A, B, C)
        </button>
        <button class="btn" id="dsp-to-a" ${r.fresh.length?'':'disabled'} style="justify-content:center">
          ${av('A')} Send All to Caller A
        </button>
        <button class="btn" id="dsp-to-b" ${r.fresh.length?'':'disabled'} style="justify-content:center">
          ${av('B')} Send All to Caller B
        </button>
        <button class="btn" id="dsp-to-c" ${r.fresh.length?'':'disabled'} style="justify-content:center">
          ${av('C')} Send All to Caller C
        </button>
        <button class="btn soft" id="dsp-to-pool" ${r.fresh.length?'':'disabled'} style="justify-content:center">
          📦 Store in Unassigned Pool
        </button>
      </div>
    </div>` : ''}
  </section>

  <section class="panel">
    <div class="panel-h">
      <h3>2. Current Caller Queue Status</h3>
      <button class="btn soft" id="dsp-rebalance" ${un?'':'disabled'}>${ic('users',16)} Split ${un} Unassigned Leads Equally</button>
    </div>
    <div class="alloc">
      <div>
        <span class="avatar" style="background:var(--surface-2);color:var(--ink-2)">📦</span>
        <div><b>${un}</b><div class="faint" style="font-size:12px">Unassigned in Pool</div></div>
      </div>
      ${callerStats.map(s=>`
      <div>
        ${av(s.c)}
        <div>
          <b>${s.total}</b>
          <div class="faint" style="font-size:12px">${s.name} · ${s.uncalled} fresh to call (${s.callsToday} called today)</div>
        </div>
      </div>`).join('')}
    </div>
  </section>
  `;

  // Attach event handlers
  const fi = m.querySelector('#dsp-file-in');
  const drop = m.querySelector('#dsp-drop');
  if(fi) fi.onchange=()=>fi.files[0]&&readFile(fi.files[0]);
  if(drop){
    ['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));
    ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')}));

  const bPool = m.querySelector('#dsp-to-pool');

  };

  const bReset = m.querySelector('#dsp-reset-act');
  if(bReset) bReset.onclick=()=>resetActivityMetrics();
}

function checkRows(rows,file){
  const existing=new Map(LEADS.map(l=>[digits(l.phone),l]));const seen=new Set();const fresh=[],dupes=[];
  rows.forEach(r=>{const p=digits(r.phone);if(p.length<10){dupes.push({...r,phone:p.padEnd(10,'0'),why:'Invalid phone number'});return}
    if(existing.has(p)){const e=existing.get(p);dupes.push({...r,phone:p,why:`Already in CRM — ${e.company}${e.caller?` (${CALLERS[e.caller].name})`:''}`})}
    else if(seen.has(p)){dupes.push({...r,phone:p,why:'Repeated inside this sheet'})}
    else{seen.add(p);fresh.push({...r,phone:p})}});
  S.importRes={file,total:rows.length,fresh,dupes};renderTab();
}
function mapRow(o){const g=keys=>{for(const k in o){const kk=k.toLowerCase();if(keys.some(x=>kk.includes(x)))return o[k]}return ''};
  return {name:g(['contact','name','person']),company:g(['company','business','firm','studio']),phone:String(g(['phone','mobile','number','contact no'])),website:g(['website','url','site']),city:g(['city','location']),hook:g(['hook','intro','pitch']),details:g(['detail','note','about'])}}
function readFile(f){
  const rd=new FileReader();
  rd.onload=()=>{try{
    let rows=[];
    if(window.XLSX){const wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''})}
    else{const txt=new TextDecoder().decode(rd.result);const lines=txt.split(/\r?\n/).filter(Boolean);const h=lines[0].split(',');rows=lines.slice(1).map(li=>{const v=li.split(',');const o={};h.forEach((k,i)=>o[k.trim()]=(v[i]||'').trim());return o})}
    checkRows(rows.map(mapRow),f.name);
  }catch(err){toast('Could not read that file. Save it as .xlsx or .csv with a header row and try again.')}};
  rd.readAsArrayBuffer(f);
}

function repRange(){
  const n=Date.now(),s=dayStart(n),r=S.rep.range;
  if(r==='daily')return[s,n+1,'Today'];
  if(r==='weekly')return[s-6*DAY,n+1,'Last 7 days'];
  if(r==='monthly')return[s-29*DAY,n+1,'Last 30 days'];
  const f=S.rep.from?new Date(S.rep.from+'T00:00').getTime():s-6*DAY, t=S.rep.to?new Date(S.rep.to+'T00:00').getTime()+DAY:n+1;
  return[f,t,`${fmtDate(f)} – ${fmtDate(t-1)}`];
}
function chartSVG(from,to,callers){
  let buckets=[];
  if(S.rep.range==='daily'){for(let h=9;h<=19;h++)buckets.push([atHour(from,h,0),atHour(from,h+1,0),h<12?`${h}am`:h===12?'12pm':`${h-12}pm`])}
  else{for(let d=dayStart(from);d<to&&buckets.length<62;d+=DAY)buckets.push([d,d+DAY,new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short'})])}
  const data=buckets.map(([a,b])=>callers.map(c=>{let n=0;LEADS.forEach(l=>l.history.forEach(e=>{if(e.by===c&&e.t>=a&&e.t<b)n++}));return n}));
  const max=Math.max(4,...data.flat()), step=Math.ceil(max/4), top=step*4;
  const W=820,H=250,ml=34,mr=8,mt=12,mb=30,pw=W-ml-mr,ph=H-mt-mb;
  const gw=pw/buckets.length, bw=Math.max(2,Math.min(14,(gw*.78)/callers.length));
  const every=Math.ceil(buckets.length/12);
  let g='';
  for(let i=0;i<=4;i++){const y=mt+ph-(i*step/top)*ph;g+=`<line x1="${ml}" x2="${W-mr}" y1="${y}" y2="${y}" stroke="#E2E9F2" ${i?'stroke-dasharray="3 4"':''}/><text x="${ml-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#8593A8">${i*step}</text>`}
  data.forEach((vals,i)=>{const gx=ml+i*gw+(gw-bw*callers.length)/2;
    vals.forEach((v,j)=>{const h=v/top*ph;g+=`<rect x="${gx+j*bw}" y="${mt+ph-h}" width="${bw-1.5}" height="${h}" rx="2.5" fill="${CALLERS[callers[j]].hex}"><title>${CALLERS[callers[j]].name} · ${buckets[i][2]}: ${v} calls</title></rect>`});
    if(i%every===0)g+=`<text x="${ml+i*gw+gw/2}" y="${H-10}" text-anchor="middle" font-size="11" fill="#8593A8">${buckets[i][2]}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Calls per ${S.rep.range==='daily'?'hour':'day'} by caller">${g}</svg>`;
}

function aReports(m){

  const best=ranked[0].c;
  const sum=k=>rows.reduce((a,r)=>a+r[k],0);
  m.innerHTML=`
  <div class="page-head"><div><h1>Performance Reports</h1><p>Caller-wise numbers for <b>${label}</b>.</p></div>

    ${S.rep.range==='custom'?`<input type="date" class="input" id="rf" value="${S.rep.from}" aria-label="From date"><span class="faint">to</span><input type="date" class="input" id="rt" value="${S.rep.to}" aria-label="To date">`:''}
    <select class="select" id="rc" style="margin-left:auto"><option value="all">All callers</option>${'ABC'.split('').map(c=>`<option value="${c}">${CALLERS[c].name}</option>`).join('')}</select>
  </section>
  <section class="rank">${ranked.map((r,i)=>`<div class="rank-card ${i===0?'first':''}"><span class="pos">#${i+1}</span>${av(r.c)}<div style="min-width:0"><b>${CALLERS[r.c].name}</b><div class="muted num" style="font-size:12.5px">${r.interested} interested · ${r.calls} calls · ${r.rate}% conv.</div></div></div>`).join('')}</section>
  <section class="panel">
    <div class="panel-h"><h3>Calls per ${S.rep.range==='daily'?'hour':'day'}</h3><div class="legend">${callers.map(c=>`<span><i style="background:${CALLERS[c].hex}"></i>${CALLERS[c].name}</span>`).join('')}</div></div>
    <div class="chart-box">${chartSVG(from,to,callers)}</div>
  </section>
  <section class="panel">
    <div class="panel-h"><h3>Caller comparison</h3><span class="faint" style="font-size:12.5px">Conv. rate = interested ÷ unique leads contacted</span></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Caller</th><th class="r">Assigned</th><th class="r">Calls made</th><th class="r">Unique contacted</th><th class="r">Received</th><th class="r">Not received</th><th class="r">Interested</th><th class="r">Callbacks</th><th class="r">Pending F/U</th><th class="r">Not interested</th><th class="r">Converted</th><th class="r">Remaining</th><th class="r">Avg calls/day</th><th class="r">Conv. rate</th></tr></thead>
      <tbody>${rows.map(r=>`<tr class="${r.c===best&&rows.length>1?'top-row':''}"><td><span style="display:inline-flex;align-items:center;gap:8px">${av(r.c,'')}<b>${CALLERS[r.c].name}</b>${r.c===best&&rows.length>1?'<span class="pill s-INT">Top</span>':''}</span></td>
        ${['assigned','calls','unique','received','notReceived','interested','callbacks','pending','notInterested','converted','remaining','avg'].map(k=>`<td class="r">${r[k]}</td>`).join('')}<td class="r"><b>${r.rate}%</b></td></tr>`).join('')}
      ${rows.length>1?`<tr><td><b>Team total</b></td>${['assigned','calls','unique','received','notReceived','interested','callbacks','pending','notInterested','converted','remaining'].map(k=>`<td class="r"><b>${sum(k)}</b></td>`).join('')}<td class="r"><b>${(sum('avg')).toFixed(1)}</b></td><td class="r"><b>${sum('unique')?Math.round(sum('interested')/sum('unique')*100):0}%</b></td></tr>`:''}
      </tbody></table></div>
  </section>`;
  m.querySelector('#rc').value=S.rep.caller;
  m.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{S.rep.range=b.dataset.range;aReports(m)});

  const rf=m.querySelector('#rf'),rt=m.querySelector('#rt');
  if(rf){rf.onchange=()=>{S.rep.from=rf.value;aReports(m)};rt.onchange=()=>{S.rep.to=rt.value;aReports(m)}}

function aHistory(m){
  const q=S.hist.q.trim().toLowerCase();
  const F={all:()=>true,fu:pendingFU,int:l=>l.status==='INT',conv:l=>!!l.convertedAt};
  let list=LEADS.filter(l=>l.history.some(e=>e.status!=='NOTE')||F[S.hist.f]!==F.all).filter(F[S.hist.f]).filter(l=>!q||(l.company+' '+l.name+' '+l.phone).toLowerCase().includes(q));
  if(S.hist.f==='fu')list.sort((a,b)=>a.followUp-b.followUp);else list.sort((a,b)=>(b.history.at(-1)?.t||0)-(a.history.at(-1)?.t||0));
  if(!S.hist.id||!list.find(l=>l.id===S.hist.id))S.hist.id=list[0]?.id;
  const L=leadById(S.hist.id);
  const cnt=k=>LEADS.filter(F[k]).length;
  m.innerHTML=`
  <div class="page-head"><div><h1>Lead History</h1><p>Every call, remark, status change and follow-up for each lead.</p></div></div>
  <div class="hist">
    <div style="display:grid;gap:10px">

      <div style="display:flex;gap:6px;flex-wrap:wrap">${[['all','All called'],['fu','Follow-ups'],['int','Interested'],['conv','Converted']].map(([k,l])=>`<button class="chip ${S.hist.f===k?'on':''}" data-hf="${k}">${l}${k!=='all'?` <b>${cnt(k)}</b>`:''}</button>`).join('')}</div>
      <div class="lead-list">${list.slice(0,120).map(l=>`<button class="li ${l.id===S.hist.id?'on':''}" data-hid="${l.id}">
        <span class="t"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l.company)}</span>${l.caller?`<span class="faint" style="font-weight:500;font-size:12px">${CALLERS[l.caller].name}</span>`:''}</span>
        <span class="s">${l.convertedAt?'<span class="pill s-CONV">Converted</span>':pill(l.status)}<span class="num" style="${isDue(l)?'color:var(--warn);font-weight:600':''}">${S.hist.f==='fu'&&l.followUp?fmtDT(l.followUp):l.history.at(-1)?ago(l.history.at(-1).t):''}</span></span></button>`).join('')||'<div class="empty">No leads match.</div>'}</div>
    </div>
    ${L?`<div class="panel">
      <div class="panel-h"><div><h3 style="font-size:20px">${esc(L.company)}</h3><div class="muted">${esc(L.name)} · <span class="num">${phoneFmt(L.phone)}</span></div></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">${L.status==='INT'&&!L.convertedAt?`<button class="btn soft" id="mk-conv">${ic('check',16)} Mark as converted</button>`:''}
        <select class="select" id="h-assign" aria-label="Reassign"><option value="">Unassigned</option>${'ABC'.split('').map(c=>`<option value="${c}" ${L.caller===c?'selected':''}>${CALLERS[c].name}</option>`).join('')}</select></div></div>
      <div class="detail-grid">
        <div><span>Current status</span>${L.convertedAt?'<span><span class="pill s-CONV">Converted</span></span>':`<span>${pill(L.status,false)}</span>`}</div>
        <div><span>Caller</span><b>${L.caller?CALLERS[L.caller].name:'Unassigned'}</b></div>
        <div><span>Next follow-up</span><b class="num" style="${isDue(L)?'color:var(--warn)':''}">${pendingFU(L)?fmtDT(L.followUp):'None'}</b></div>
        <div><span>Total calls</span><b class="num">${L.history.filter(e=>e.status!=='NOTE').length}</b></div>
        <div><span>City</span><b>${esc(L.city)}</b></div>
        <div><span>Source sheet</span><b style="font-weight:500;font-size:12.5px">${esc(L.source)}</b></div>
      </div>
      <div class="eyebrow" style="margin-bottom:12px">Call record</div>
      ${L.history.length?`<div class="timeline">${[...L.history].reverse().map(e=>timelineItem(e)).join('')}${L.convertedAt?'':''}</div>`:'<div class="empty">Not called yet.</div>'}

  const mc=m.querySelector('#mk-conv');if(mc)mc.onclick=()=>{L.convertedAt=Date.now();L.history.push({t:Date.now(),by:'admin',status:'NOTE',remark:'Marked as converted client by admin'});toast(`${L.company} marked as converted`);aHistory(m)};

}

            </div>
            <label class="btn soft sm" for="c-rec-file" style="cursor:pointer;display:inline-flex;align-items:center;gap:6px">
              ${ic('upload', 14)} <span>${D.recording ? 'Replace Audio File' : 'Select Audio Recording'}</span>
              <input type="file" id="c-rec-file" accept="audio/*,.mp3,.m4a,.wav,.aac,.ogg" hidden>
            </label>
          </div>

          ${D.recording ? `
          <div style="display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px;flex-wrap:wrap">
            <span style="font-size:16px">🎵</span>
            <div style="flex:1;min-width:140px;overflow:hidden">
              <div style="font-weight:600;font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(D.recording.name)}</div>
              <div class="faint" style="font-size:11px">${D.recording.size ? Math.round(D.recording.size/1024) + ' KB' : ''}</div>
            </div>
            <audio controls src="${D.recording.url}" style="height:32px;max-width:240px"></audio>
            <button type="button" class="btn sm" id="c-rec-del" style="color:var(--warn);border-color:#F8D7DA;padding:4px 10px">Remove</button>
          </div>` : `
          <div class="faint" style="font-size:12px;color:var(--ink-3)">
            Upload client call recording audio here. It will automatically be sent to Admin Command Center for review.
          </div>`}
        </div>

        <div class="field"><label for="remark" style="font-size:12.5px;font-weight:600">Discussion Notes & Remarks</label><textarea class="input" id="remark" placeholder="What did the client say? Budget, timing, next step…">${esc(D.remark)}</textarea></div>
        <button class="btn primary" id="save" style="justify-content:center;padding:12px;font-size:14px;font-weight:700" ${D.status?'':'disabled'}>${ic('check',16)} Save Call Outcome & Next Lead ${ic('arrow',16)}</button>
      </section>
      <section class="panel">
        <div class="panel-h" style="margin-bottom:10px"><h3>Previous calls</h3><span class="faint num">${prevCalls.length}</span></div>
        ${L.history.length?`<div class="timeline">${[...L.history].reverse().map(timelineItem).join('')}</div>`:'<div class="empty" style="padding:16px">First call to this lead.</div>'}
      </section>
    </div>
  </div>`;

  const go=i=>{S.desk={idx:i,status:null,remark:'',fu:'',conv:false,recording:null};cDesk(m);window.scrollTo({top:0,behavior:'smooth'})};
  m.querySelector('#prev').onclick=()=>go(Math.max(0,S.desk.idx-1));
  m.querySelector('#next').onclick=()=>go((S.desk.idx+1)%ls.length);
  const gd=m.querySelector('#go-due');if(gd)gd.onclick=()=>{S.tab='follow';render()};
  
  const bDeskAdd = m.querySelector('#btn-desk-add');
  if(bDeskAdd) bDeskAdd.onclick = () => openAddCallModal(S.role);

  m.querySelector('#copy-ph').onclick=()=>{const t='+91'+L.phone;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Number copied: '+t)).catch(()=>{const r=document.createRange();r.selectNodeContents(m.querySelector('.ph'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Number selected — press Ctrl+C')})};
  
  const rm=m.querySelector('#remark');rm.oninput=()=>D.remark=rm.value;
  m.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{D.status=b.dataset.st;if((D.status==='CB'||D.status==='FU')&&!D.fu)D.fu=toLocalInput(atHour(dayStart(Date.now())+DAY,11,0));cDesk(m)});
  const fd=m.querySelector('#fu-dt');if(fd)fd.onchange=()=>D.fu=fd.value;
  m.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const v=b.dataset.q,n=Date.now();const t=v==='t11'?atHour(dayStart(n)+DAY,11,0):v==='t17'?atHour(dayStart(n)+DAY,17,0):v==='d3'?atHour(dayStart(n)+3*DAY,11,0):n+(+v);D.fu=toLocalInput(t);cDesk(m)});
  const cv=m.querySelector('#conv');if(cv)cv.onchange=()=>D.conv=cv.checked;

  // Recording file handler
  const cRecFile = m.querySelector('#c-rec-file');
  if(cRecFile){
    cRecFile.onchange = () => {
      const file = cRecFile.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        D.recording = {
          name: file.name,
          size: file.size,
          type: file.type,
          url: ev.target.result,
          uploadedAt: Date.now()
        };
        try {
          const fd = new FormData();
          fd.append('recording', file);
          fetch('/api/recordings/upload', { method: 'POST', body: fd })
            .then(res => res.json())
            .then(data => { if(data.url) D.recording.serverUrl = data.url; })
            .catch(()=>{});
        } catch(err){}
        cDesk(m);
      };
      reader.readAsDataURL(file);
    };
  }
  const cRecDel = m.querySelector('#c-rec-del');
  if(cRecDel){
    cRecDel.onclick = () => { D.recording = null; cDesk(m); };
  }

  m.querySelector('#save').onclick=()=>{
    if(!D.status)return;
    const e={t:Date.now(),by:S.role,status:D.status,remark:D.remark.trim()};
    if(needsFU){const t=new Date(D.fu).getTime();if(!t){toast('Pick a callback date and time first.');return}e.fu=t;L.followUp=t}else L.followUp=null;
    
    if(D.recording){
      e.recording = D.recording;
      RECORDINGS.unshift({
        id: 'rec-' + Date.now(),
        caller: S.role,
        leadId: L.id,
        company: L.company,
        name: L.name,
        phone: L.phone,
        city: L.city,
        status: D.status,
        remark: D.remark.trim(),
        date: Date.now(),
        file: D.recording.name,
        size: D.recording.size,
        url: D.recording.serverUrl || D.recording.url
      });
      saveRecordingsToStorage();
    }
    
    L.history.push(e);L.status=D.status;
    if(D.status==='INT'&&D.conv)L.convertedAt=Date.now();
    saveStorage();
    D.recording = null;
    toast(`Saved: ${L.company} → ${SHORT[D.status]}`);
    const nx=ls.findIndex((l,i)=>i>S.desk.idx&&(l.status==='NC'||isDue(l)));
    go(nx>=0?nx:(S.desk.idx+1)%ls.length);
    render();
  };
}
const toLocalInput=t=>{const d=new Date(t);const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`};
function openInDesk(id){S.desk={idx:myLeads().findIndex(l=>l.id===id),status:null,remark:'',fu:'',conv:false};S.tab='desk';render();window.scrollTo(0,0)}

/* ======================= CALLER: My Leads ======================= */
function cMine(m){
  const ls=myLeads();const f=S.myFilter;
  const rows=ls.filter(l=>f==='all'||(f==='CONV'?l.convertedAt:l.status===f));
  m.innerHTML=`
  <div class="page-head"><div><h1>My Leads</h1><p>Only leads assigned to ${CALLERS[S.role].name}. Click a row to open it on the calling desk.</p></div></div>
  <div style="display:flex;gap:6px;flex-wrap:wrap">${[['all','All',ls.length],...Object.keys(ST).map(k=>[k,SHORT[k],ls.filter(l=>l.status===k).length]),['CONV','Converted',ls.filter(l=>l.convertedAt).length]].map(([k,l,n])=>`<button class="chip ${f===k?'on':''}" data-mf="${k}">${l} <b>${n}</b></button>`).join('')}</div>
  <div class="tbl-wrap tbl-scroll"><table>
    <thead><tr><th>#</th><th>Company / Contact</th><th>Phone</th><th>City</th><th>Status</th><th>Calls</th><th>Last remark</th><th>Follow-up</th></tr></thead>
    <tbody>${rows.map(l=>{const last=[...l.history].reverse().find(e=>e.status!=='NOTE');return `<tr class="click" data-open="${l.id}"><td class="faint num">${ls.indexOf(l)+1}</td>
      <td class="lead-cell"><b>${esc(l.company)}</b><span>${esc(l.name)}</span></td><td class="num">${phoneFmt(l.phone)}</td><td>${esc(l.city)}</td>
      <td>${l.convertedAt?'<span class="pill s-CONV">Converted</span>':pill(l.status)}</td><td class="num">${l.history.filter(e=>e.status!=='NOTE').length}</td>
      <td class="wrap-txt muted" style="max-width:300px">${last?esc(last.remark):'—'}</td>
      <td class="num" style="${isDue(l)?'color:var(--warn);font-weight:600':''}">${pendingFU(l)?fmtDT(l.followUp):'—'}</td></tr>`}).join('')}</tbody></table></div>`;
  m.querySelectorAll('[data-mf]').forEach(b=>b.onclick=()=>{S.myFilter=b.dataset.mf;cMine(m)});
  m.querySelectorAll('[data-open]').forEach(r=>r.onclick=()=>openInDesk(+r.dataset.open));
}

/* ======================= CALLER: Follow-ups ======================= */
function cFollow(m){
  const ls=myLeads().filter(pendingFU).sort((a,b)=>a.followUp-b.followUp);
  const n=Date.now(),eod=dayStart(n)+DAY;
  const over=ls.filter(l=>l.followUp<=n), today=ls.filter(l=>l.followUp>n&&l.followUp<eod), later=ls.filter(l=>l.followUp>=eod);
  const row=(l,o)=>{const last=[...l.history].reverse().find(e=>e.status!=='NOTE');return `<div class="fu-row ${o?'over':''}">
    <div style="min-width:0"><b>${esc(l.company)}</b><div class="muted" style="font-size:12.5px">${esc(l.name)} · <span class="num">${phoneFmt(l.phone)}</span></div></div>
    <div class="muted" style="font-size:12.5px;min-width:0">${last?esc(last.remark):''}</div>
    <div style="display:grid;justify-items:end;gap:3px"><span class="when num">${fmtDT(l.followUp)}</span>${pill(l.status)}</div>
    <button class="btn ${o?'primary':''} sm" data-open="${l.id}">${ic('phone',14)} Call now</button></div>`};
  const sec=(t,arr,o,color)=>`<section class="fu-sec"><div class="sec-title" style="color:${color}">${t} <span class="count faint num">(${arr.length})</span></div>${arr.length?arr.map(l=>row(l,o)).join(''):'<div class="empty" style="padding:16px">Nothing here.</div>'}</section>`;
  m.innerHTML=`
  <div class="page-head"><div><h1>Follow-ups</h1><p>Callbacks you scheduled. Leads move into "Due now" automatically when their time comes.</p></div></div>
  ${sec('Due now',over,true,'var(--warn)')}
  ${sec('Later today',today,false,'#1E57B0')}
  ${sec('Upcoming',later,false,'var(--ink)')}`;
  m.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openInDesk(+b.dataset.open));
}

/* ======================= CALLER: Performance ======================= */
function cPerf(m){
  const c=S.role,t=stats(c,...todayRange()),w=stats(c,dayStart(Date.now())-6*DAY,Date.now()+1),mo=stats(c,dayStart(Date.now())-29*DAY,Date.now()+1);
  const kp=(l,v,sub)=>`<div class="kpi"><span class="lbl">${l}</span><span class="val">${v}</span>${sub?`<span class="sub">${sub}</span>`:''}</div>`;
  const ls=myLeads();const counts=Object.keys(ST).map(k=>[k,ls.filter(l=>l.status===k).length]);
  const days=[];for(let i=6;i>=0;i--){const d=dayStart(Date.now())-i*DAY;let n=0;ls.forEach(l=>l.history.forEach(e=>{if(e.by===c&&e.t>=d&&e.t<d+DAY)n++}));days.push([d,n])}
  const mx=Math.max(4,...days.map(d=>d[1]));
  m.innerHTML=`
  <div class="page-head"><div><h1>My Performance</h1><p>${CALLERS[c].name} · today and recent trend.</p></div></div>
  <section class="kpis">
    ${kp('Calls today',t.calls,`${t.unique} unique leads`)}${kp('Received',t.received,`${t.notReceived} not received`)}
    ${kp('Interested',t.interested,`${t.rate}% conversion`)}${kp('Pending follow-ups',t.pending,`${t.due} due now`)}
    ${kp('Not interested',t.notInterested,'')}${kp('Left to call',t.remaining,`of ${t.assigned} assigned`)}
  </section>
  <section class="grid-2">
    <div class="panel"><div class="panel-h"><h3>Calls, last 7 days</h3><span class="faint num">avg ${w.avg}/day</span></div>
      <svg viewBox="0 0 420 170" style="width:100%;height:auto;display:block" role="img" aria-label="Calls per day over the last 7 days">
        ${[0,.5,1].map(f=>`<line x1="0" x2="420" y1="${140-f*120}" y2="${140-f*120}" stroke="#E2E9F2" ${f?'stroke-dasharray="3 4"':''}/>`).join('')}
        ${days.map(([d,n],i)=>{const h=n/mx*120,x=i*60+14;return `<rect x="${x}" y="${140-h}" width="32" height="${h}" rx="5" fill="${i===6?CALLERS[c].hex:'#C9D6EA'}"/><text x="${x+16}" y="${134-h}" text-anchor="middle" font-size="12" font-weight="600" fill="#10305F">${n}</text><text x="${x+16}" y="160" text-anchor="middle" font-size="11" fill="#8593A8">${i===6?'Today':new Date(d).toLocaleDateString('en-IN',{weekday:'short'})}</text>`}).join('')}
      </svg></div>
    <div class="panel"><div class="panel-h"><h3>Where my leads stand</h3><span class="faint num">${ls.length} leads</span></div>
      <div class="stack-bar">${counts.filter(x=>x[1]).map(([k,n])=>`<span title="${ST[k].label}: ${n}" style="width:${n/ls.length*100}%;background:${ST[k].hex}"></span>`).join('')}</div>
      <div class="stack-legend">${counts.map(([k,n])=>`<div><span style="display:inline-flex;gap:7px;align-items:center"><i style="width:9px;height:9px;border-radius:3px;background:${ST[k].hex};display:inline-block"></i>${SHORT[k]}</span><b class="num">${n}</b></div>`).join('')}</div>
    </div>
  </section>
  <section class="panel"><div class="panel-h"><h3>Summary</h3></div>
    <div class="tbl-wrap"><table><thead><tr><th>Period</th><th class="r">Calls</th><th class="r">Unique</th><th class="r">Received</th><th class="r">Interested</th><th class="r">Not interested</th><th class="r">Converted</th><th class="r">Avg/day</th><th class="r">Conv. rate</th></tr></thead>
    <tbody>${[['Today',t],['Last 7 days',w],['Last 30 days',mo]].map(([l,s])=>`<tr><td><b>${l}</b></td>${['calls','unique','received','interested','notInterested','converted','avg'].map(k=>`<td class="r">${s[k]}</td>`).join('')}<td class="r"><b>${s.rate}%</b></td></tr>`).join('')}</tbody></table></div>
  </section>`;
}

render();
</script>

</body>
</html>
